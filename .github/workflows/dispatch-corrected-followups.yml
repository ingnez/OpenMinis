name: Validate the corrected OpenMinis candidates in handoff order
on:
  push:
    branches: [grokbot-phase2-chat-motion-ci]
    paths: [.github/workflows/dispatch-corrected-followups.yml]
permissions:
  actions: write
  contents: read
jobs:
  images:
    if: github.repository == 'ingnez/OpenMinis'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Validate the named simulator cases on the candidate commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="repos/$GITHUB_REPOSITORY"
          prerequisite="$repo/actions/runs/43406167222"
          while [ "$(gh api "$prerequisite" --jq .status)" != completed ]; do
            sleep 45
          done
          test "$(gh api "$prerequisite" --jq .conclusion)" = success
          test "$(gh release view grokbot-deliver-b4eabcf --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[] | select(.name | endswith("-unsigned.ipa"))] | length')" = 1

          validate() {
            local branch="$1" sha="$2" tests="$3"
            local ref="$repo/git/ref/heads/$branch"
            local runs="$repo/actions/workflows/build-ios.yml/runs?branch=$branch&head_sha=$sha&event=workflow_dispatch&per_page=20"
            local test_id=0 status=pending conclusion=pending last_id=0 completed_checks=0 result
            test "$(gh api "$ref" --jq '.object.sha')" = "$sha"
            test_id=$(gh api "$runs" --jq '.workflow_runs[0].id // 0')
            if [ "$test_id" = 0 ]; then
              gh workflow run build-ios.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" -f ui_tests=true -f mac_runner=macos-15 -f only_testing="$tests"
            fi
            while true; do
              result=$(gh api "$runs" --jq '(.workflow_runs[0] // {}) | [(.id // 0), (.status // "pending"), (.conclusion // "pending")] | @tsv')
              IFS=$'\t' read -r test_id status conclusion <<< "$result"
              if [ "$test_id" != "$last_id" ]; then
                echo "$branch simulator run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$test_id"
                last_id="$test_id"
                completed_checks=0
              fi
              if [ "$status" = completed ]; then
                if [ "$conclusion" = success ]; then break; fi
                completed_checks=$((completed_checks + 1))
                if [ "$completed_checks" -ge 4 ]; then echo "$branch simulator tests: $conclusion"; return 1; fi
              fi
              sleep 45
            done
            test "$(gh api "$ref" --jq '.object.sha')" = "$sha"
            local evidence
            evidence=$(mktemp -d)
            gh run download "$test_id" --repo "$GITHUB_REPOSITORY" --name Minis-e2e-early --dir "$evidence"
            python3 - "$evidence/e2e-summary.md" "$tests" <<'PY'
          import sys
          from pathlib import Path

          expected = {test.split('/', 1)[1].replace('/', '.') for test in sys.argv[2].split(',')}
          results = {}
          for line in Path(sys.argv[1]).read_text().splitlines():
              if line.startswith('|'):
                  _, name, outcome, *_ = line.split('|')
                  if name.strip() in expected:
                      results[name.strip()] = outcome.strip().startswith('PASS')
          missing = sorted(test for test in expected if not results.get(test))
          if missing:
              sys.exit(f'Missing or failed XCTest cases: {", ".join(missing)}')
          print(f'{len(expected)}/{len(expected)} targeted XCTest cases passed')
          PY
          }


