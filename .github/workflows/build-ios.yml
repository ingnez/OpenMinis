name: Build Minis iOS IPA (unsigned)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-computer-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 云端任务与同会话持久化回归
        run: |
          set -o pipefail
          python3 -m unittest discover -s cloud-agent -p 'test*.py' -v 2>&1 | tee cloud-v2-tests.log
      - name: 安装并验证真实云电脑环境
        run: |
          set -o pipefail
          sudo bash cloud-agent/install.sh 2>&1 | tee cloud-install.log
          sudo bash cloud-agent/install-desktop.sh 2>&1 | tee cloud-desktop-install.log
          sudo bash cloud-agent/test_desktop.sh 2>&1 | tee cloud-desktop-test.log
          sudo cp cloud-agent/test_browser_real.py /opt/openminis-cloud-agent/test_browser_real.py
          sudo chown root:root /opt/openminis-cloud-agent/test_browser_real.py
          sudo -u openminis env DISPLAY=:99 XAUTHORITY=/var/lib/openminis-cloud-agent/.Xauthority HOME=/var/lib/openminis-cloud-agent PLAYWRIGHT_BROWSERS_PATH=/var/lib/openminis-cloud-agent/ms-playwright OPENMINIS_REAL_BROWSER_TEST=1 /opt/openminis-cloud-agent/venv/bin/python3 /opt/openminis-cloud-agent/test_browser_real.py 2>&1 | tee cloud-browser-real.log
      - name: 客户端断线后的真实浏览器模型循环
        run: |
          set -o pipefail
          sudo cp cloud-agent/test_browser_agent_real.py /opt/openminis-cloud-agent/test_browser_agent_real.py
          sudo -u openminis env DISPLAY=:99 XAUTHORITY=/var/lib/openminis-cloud-agent/.Xauthority HOME=/var/lib/openminis-cloud-agent PLAYWRIGHT_BROWSERS_PATH=/var/lib/openminis-cloud-agent/ms-playwright OPENMINIS_REAL_BROWSER_AGENT_TEST=1 OPENMINIS_EVIDENCE_PATH=/tmp/combined-browser-evidence.log /opt/openminis-cloud-agent/venv/bin/python3 /opt/openminis-cloud-agent/test_browser_agent_real.py 2>&1 | tee cloud-browser-agent.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-computer-linux-evidence
          path: |
            cloud-v2-tests.log
            cloud-install.log
            cloud-desktop-install.log
            cloud-desktop-test.log
            cloud-browser-real.log
            cloud-browser-agent.log
  build:
    runs-on: macos-26
    timeout-minutes: 350

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 云端 Agent 服务集成验证与资源打包
        run: |
          set -o pipefail
          python3 -m unittest discover -s cloud-agent -p 'test*.py' -v 2>&1 | tee cloud-agent-test.log
          python3 scripts/prepare_cloud_agent.py
          swiftc -swift-version 5 src/ios/Views/Chat/AIChatView/Cloud/CloudContextFiles.swift scripts/CloudContextFilesTests.swift -o /tmp/cloud-context-tests
          /tmp/cloud-context-tests | tee cloud-context-test.log
          python3 scripts/test_cloud_send_gate.py | tee cloud-send-gate-test.log
          swiftc -swift-version 5 src/ios/Views/Chat/AIChatView/Cloud/CloudModelCatalog.swift scripts/CloudModelCatalogTests.swift -o /tmp/cloud-model-tests
          /tmp/cloud-model-tests | tee cloud-model-test.log
          swiftc -swift-version 5 scripts/CloudChatTypecheckSupport.swift scripts/CloudChatBridgeTests.swift src/ios/Views/Chat/AIChatView/Cloud/CloudChatBridge.swift -o /tmp/cloud-chat-tests
          /tmp/cloud-chat-tests | tee cloud-chat-test.log
          xcrun swiftc -swift-version 5 -whole-module-optimization -emit-sil -o /tmp/cloud-compile-check.sil -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios17.0 scripts/CloudConnectionTypecheckSupport.swift scripts/CloudViewsTypecheckSupport.swift scripts/CloudChatTypecheckSupport.swift scripts/CloudPhase1TypecheckSupport.swift src/ios/Views/Chat/AIChatView/Cloud/*.swift 2>&1 | tee cloud-connection-typecheck.log

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          sw_vers

      - name: 语音模型目录刷新回归
        run: |
          set -o pipefail
          python3 scripts/test_voice_catalog.py | tee voice-catalog-test.log

      - name: 无上限子代理与实际通话入口回归
        run: |
          set -o pipefail
          python3 scripts/test_build6.py | tee build6-test.log

      - name: 实时语音协议回归与 iOS 类型检查
        run: |
          set -o pipefail
          python3 scripts/test_voice_protocols.py | tee voice-protocols-test.log
          python3 scripts/test_realtime_voice.py | tee realtime-test.log
          xcrun swiftc -swift-version 5 -typecheck -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios16.0 scripts/RealtimeTypecheckSupport.swift src/ios/Views/Chat/AIChatView/Realtime/*.swift 2>&1 | tee realtime-typecheck.log

      - name: 下载并校验官方 VAD 二进制
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_vad.py

      - name: 校验并准备固定版本 SwiftMath 源码
        run: python3 scripts/prepare_swiftmath.py

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          git config --global http.version HTTP/1.1
          for attempt in 1 2 3; do
            if xcodebuild -resolvePackageDependencies \
              -project src/ios/Minis.xcodeproj -scheme Minis \
              -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/build/SourcePackages" \
              -scmProvider system -disablePackageRepositoryCache \
              2>&1 | tee package-resolve.log; then
              exit 0
            fi
            rm -rf "$GITHUB_WORKSPACE/build/SourcePackages"
          done
          exit 1

      - name: 验证启动修复和本轮功能
        run: |
          set -euo pipefail
          git diff --check
          xcrun swiftc -typecheck -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios16.0 -application-extension src/ios/Shared/PendingShare.swift src/ios/Shared/SharedContainerStore.swift
          swiftc src/ios/Shared/PendingShare.swift src/ios/Shared/SharedContainerStore.swift scripts/StorageFallbackTests.swift -o /tmp/storage-test
          /tmp/storage-test | tee storage-test.log
          python3 scripts/test_reset.py | tee reset-test.log
          python3 scripts/test_soul_unlimited.py | tee soul-test.log

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Install build dependencies
        run: |
          brew install ninja llvm lld libarchive pkg-config
          python3 -m pip install --break-system-packages meson
          echo "LLVM prefix: $(brew --prefix llvm)"
          meson --version

      - name: Ensure Metal toolchain
        run: |
          if ! xcrun --sdk iphoneos metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk iphoneos metal --version

      - name: Prepare build config
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig

      - name: Build LAME
        run: ./deps/build_lame.sh

      - name: Build FFmpeg
        run: ./deps/build_ffmpeg.sh

      - name: Build iSH
        run: |
          export PATH="$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
          ld.lld --version
          ./deps/build_ish.sh

      - name: Prepare Alpine rootfs
        run: ./deps/prepare_alpine_rootfs.sh

      - name: Build rclone
        run: ./deps/build_rclone_ios.sh

      - name: Build Minis app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/build/SourcePackages" \
            -scmProvider system \
            -disableAutomaticPackageResolution \
            CURRENT_PROJECT_VERSION=12 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          if [ -z "$APP" ]; then
            echo "Minis.app not found" >&2
            find build/Build/Products -maxdepth 3 -name '*.app' >&2
            exit 1
          fi
          echo "Packaging: $APP"
          rm -rf Payload Minis-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Minis-unsigned.ipa Payload
          ls -lh Minis-unsigned.ipa
          shasum -a 256 Minis-unsigned.ipa | tee SHA256SUMS
          git rev-parse HEAD > SOURCE_COMMIT.txt
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Minis-unsigned-ipa
          path: |
            Minis-unsigned.ipa
            SHA256SUMS
            SOURCE_COMMIT.txt
            xcodebuild.log
            reset-test.log
            soul-test.log
            realtime-test.log
            build6-test.log
            voice-catalog-test.log
            realtime-typecheck.log
            cloud-send-gate-test.log
            cloud-context-test.log
            cloud-chat-test.log
            cloud-model-test.log
            cloud-agent-test.log
            cloud-connection-typecheck.log
            storage-test.log
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            xcodebuild.log
            package-resolve.log
            cloud-send-gate-test.log
            cloud-context-test.log
            cloud-chat-test.log
            cloud-model-test.log
            cloud-agent-test.log
            cloud-connection-typecheck.log
            storage-test.log
            reset-test.log
            soul-test.log
            realtime-test.log
            build6-test.log
            voice-catalog-test.log
            realtime-typecheck.log
          if-no-files-found: ignore
          retention-days: 30
