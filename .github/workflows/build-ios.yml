  cloud-computer-linux:
    if: ${{ !inputs.quick }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 云端任务与同会话持久化回归
        run: |
          set -o pipefail
          python3 -m unittest discover -s cloud-agent -p 'test*.py' -v 2>&1 | tee cloud-v2-tests.log
      - name: 安装并验证真实云电脑环境
        run: |
          set -o pipefail
          sudo bash cloud-agent/install.sh 2>&1 | tee cloud-install.log
          sudo bash cloud-agent/install-desktop.sh 2>&1 | tee cloud-desktop-install.log
          sudo bash cloud-agent/test_desktop.sh 2>&1 | tee cloud-desktop-test.log
          sudo cp cloud-agent/test_browser_real.py /opt/openminis-cloud-agent/test_browser_real.py
          sudo chown root:root /opt/openminis-cloud-agent/test_browser_real.py
          sudo -u openminis env DISPLAY=:99 XAUTHORITY=/var/lib/openminis-cloud-agent/.Xauthority HOME=/var/lib/openminis-cloud-agent PLAYWRIGHT_BROWSERS_PATH=/var/lib/openminis-cloud-agent/ms-playwright OPENMINIS_REAL_BROWSER_TEST=1 /opt/openminis-cloud-agent/venv/bin/python3 /opt/openminis-cloud-agent/test_browser_real.py 2>&1 | tee cloud-browser-real.log
      - name: 依赖安装后补齐独立屏幕与图片压缩验收
        run: |
          set -euo pipefail
          cd cloud-agent
          /opt/openminis-cloud-agent/venv/bin/python3 -m unittest -v \
            test_phase13_displays.PerBotDisplayTests.test_display_starts_and_vnc_listens \
            test_phase14_efficiency.DesktopThumbnailTests.test_fake_scrot_is_downscaled_to_jpeg \
            test_phase61_pillow_install.PillowInstallTests.test_02_large_photo_compressed_with_pillow \
            2>&1 | tee ../cloud-dependency-cases.log
          if grep -q 'skipped' ../cloud-dependency-cases.log; then
            echo 'Required desktop/image dependency cases were skipped.' >&2
            exit 1
          fi
      - name: 云电脑中文输入回归（真 Xvfb + 真 xclip：不再卡 5 秒超时；剪贴板往返；没剪贴板工具时逐字输入）
        run: |
          set -euo pipefail
          cd cloud-agent && OPENMINIS_REAL_X_TEST=1 python3 -m unittest test_phase58_unicode_type -v 2>&1 | tee ../cloud-unicode-type.log
          cd ..
          TOKEN=$(sudo cat /etc/openminis/token)
          for body in '{"action":"type","text":"你好，云电脑：中文输入回归"}' '{"action":"clipboard_set","text":"手机剪贴板→云电脑"}' '{"action":"clipboard_get"}'; do
            T0=$(date +%s%N)
            R=$(curl -sS -m 10 -w '\n%{http_code}' -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$body" http://127.0.0.1:18765/v1/desktop/input)
            MS=$(( ($(date +%s%N) - T0) / 1000000 ))
            echo "$body -> ${MS}ms $R" | tee -a cloud-unicode-type.log
            test "$(echo "$R" | tail -n1)" = "200"
            test "$MS" -lt 3000
          done
          echo "$R" | head -n1 | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["text"]=="手机剪贴板→云电脑", d; print("剪贴板往返一致")' | tee -a cloud-unicode-type.log
      - name: 云电脑剪贴板与输入法中文（真 Xvfb + xclip / xdotool + 真 Tk 程序收字；服务无 LANG 时的 locale 根因）
        run: |
          set -euo pipefail
          sudo apt-get install -y -q python3-tk >/dev/null
          cd cloud-agent && OPENMINIS_REAL_X_TEST=1 python3 -m unittest test_cc_clipboard_utf8 -v 2>&1 | tee ../cloud-cc-clipboard.log
      - name: 云电脑画面页 window.om 真浏览器端到端（指针 / 点击 / 按键 / 剪贴板 / 滚轮 / 缩放 / 画质 / 截图 / 录屏）
        run: |
          set -o pipefail
          bash scripts/desktop_bridge_e2e.sh 2>&1 | tee cloud-desktop-bridge-e2e.log
      - name: 云电脑首帧实测（回环：连接、RFB 握手、首帧耗时与字节数）
        continue-on-error: true
        run: |
          set -o pipefail
          python3 cloud-agent/bench_desktop_connect.py --port 5901 --rounds 9 2>&1 | tee cloud-desktop-bench.log
          python3 cloud-agent/bench_desktop_connect.py --ws 18766 --path 'websockify?token=main' --rounds 9 2>&1 | tee -a cloud-desktop-bench.log
      - name: 云电脑代理：安装脚本装好的 sing-box 真连测速与配置校验
        run: |
          set -euo pipefail
          SB=/var/lib/openminis-cloud-agent/data/proxy/bin/sing-box
          sudo "$SB" version | head -1 | tee cloud-proxy.log
          sudo cp "$SB" /tmp/sing-box && sudo chmod 755 /tmp/sing-box
          TOKEN=$(sudo cat /etc/openminis/token)
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18765/v1/proxy | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["installed"] and d["mode"]=="off", d; print("proxy installed", d["version"])' | tee -a cloud-proxy.log
          cd cloud-agent && OPENMINIS_SINGBOX=/tmp/sing-box python3 -W ignore -m unittest test_phase19_proxy -v 2>&1 | tee -a ../cloud-proxy.log
      - name: 客户端断线后的真实浏览器模型循环
        run: |
          set -o pipefail
          sudo cp cloud-agent/test_browser_agent_real.py /opt/openminis-cloud-agent/test_browser_agent_real.py
          sudo -u openminis env DISPLAY=:99 XAUTHORITY=/var/lib/openminis-cloud-agent/.Xauthority HOME=/var/lib/openminis-cloud-agent PLAYWRIGHT_BROWSERS_PATH=/var/lib/openminis-cloud-agent/ms-playwright OPENMINIS_REAL_BROWSER_AGENT_TEST=1 OPENMINIS_EVIDENCE_PATH=/tmp/combined-browser-evidence.log /opt/openminis-cloud-agent/venv/bin/python3 /opt/openminis-cloud-agent/test_browser_agent_real.py 2>&1 | tee cloud-browser-agent.log
      - name: 只更新服务器 Agent（重复安装）不丢 Token、主密钥、数据和桌面配置
        run: |
          set -euo pipefail
          TOKEN=$(sudo cat /etc/openminis/token)
          KEY=$(sudo sha256sum /etc/openminis/master.key)
          SID=$(curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"title":"升级前"}' http://127.0.0.1:18765/v1/sessions | python3 -c 'import sys,json;print(json.load(sys.stdin)["session_id"])')
          sudo touch /opt/openminis-cloud-agent/cloud_stale_module.py
          sudo bash cloud-agent/install.sh 2>&1 | tee cloud-reinstall.log
          test "$(sudo cat /etc/openminis/token)" = "$TOKEN"
          test "$(sudo sha256sum /etc/openminis/master.key)" = "$KEY"
          test ! -e /opt/openminis-cloud-agent/cloud_stale_module.py
          grep -q 'sing-box .* 已安装$' cloud-reinstall.log   # 重复安装不重新下载代理内核
          grep -q '^Environment=DISPLAY=' /etc/systemd/system/openminis-cloud-agent.service
          curl -fsS -H "Authorization: Bearer $TOKEN" "http://127.0.0.1:18765/v1/sessions/$SID" > /dev/null
          curl -fsS http://127.0.0.1:18765/health | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d.get("agent_version"), d; print("agent", d["agent_version"])'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-computer-linux-evidence
          path: |
            cloud-v2-tests.log
            cloud-install.log
            cloud-desktop-install.log
            cloud-unicode-type.log
            cloud-desktop-test.log
            cloud-browser-real.log
            cloud-dependency-cases.log
            cloud-browser-agent.log
            cloud-proxy.log
            cloud-desktop-bench.log
            cloud-desktop-bridge-e2e.log
            cloud-cc-clipboard.log
  build:
    if: ${{ !inputs.quick && !inputs.ui_tests }}
    needs: [wait-mac]
    runs-on: [self-hosted, macOS, openminis-mac]
    timeout-minutes: 350
    concurrency:
      group: ${{ github.repository }}-macos
      cancel-in-progress: false

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: 使用 Mac-58 已安装的 Xcode 27.0（仅当前任务）
        run: python3 scripts/select_mac58_xcode.py

      - name: 配置 launchd runner 的构建工具路径
        run: |
          for directory in /opt/homebrew/bin /opt/homebrew/sbin /usr/local/bin; do
            if [ -d "$directory" ]; then echo "$directory" >> "$GITHUB_PATH"; fi
          done

      - name: 使用 runner 工具目录内的 CI Python 3.13
        run: bash scripts/prepare_mac_python.sh

      - name: 复用独立的 CI 编译缓存
        run: python3 scripts/prepare_mac_build_cache.py device

      - name: iOS 16 API 兼容预检
        run: |
          # 部署目标是 iOS 16：禁止双参数 onChange（iOS 17+）；云端页面里禁止未加 #available 的 iOS 17 专属 API
          if grep -rnE --include='*.swift' 'onChange\(of:[^)]*\) \{ *[_a-zA-Z]+ *, ' src/ios | grep -v '/MinisTests/'; then
            echo "::error::发现 iOS 17 才有的双参数 onChange，请改成 .onChange(of: x) { newValue in ... }"; exit 1
          fi
          if grep -rnE --include='*.swift' 'AVAudioApplication|navigationDestination\(item:|@Observable\b|ContentUnavailableView|\.sensoryFeedback|\.symbolEffect|\.scrollPosition\(' src/ios/Views/Chat/AIChatView/Cloud src/ios/Views/ContentView; then
            echo "::error::云端 / 首页代码使用了 iOS 17+ API，请改用 iOS 16 写法或用 #available 包起来"; exit 1
          fi
          echo "iOS 16 API 预检通过"

      - name: 云端 Agent 服务集成验证与资源打包
        env:
          no_proxy: localhost,127.0.0.1,::1
        run: |
          set -o pipefail
          python3 -m unittest discover -s cloud-agent -p 'test*.py' -v 2>&1 | tee cloud-agent-test.log
          python3 scripts/prepare_cloud_agent.py
