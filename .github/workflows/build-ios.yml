        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Install build dependencies
        run: |
          bash scripts/prepare_mac_build_tools.sh

      - name: Prepare build config
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig
          # Offline request-serialization tests need a nonempty identifier.
          # This synthetic value never authenticates and is not used by IPA builds.
          printf '%s\n' 'ANTHROPIC_OAUTH_IDENTIFIER_PROMPT = OpenMinis synthetic offline serialization fixture' >> src/ios/Configs/ProviderCustomization.xcconfig

      - name: Cache FFmpeg source tarball
        uses: actions/cache@v4
        with:
          path: deps/.cache/ffmpeg-6.1.2.tar.xz
          key: ffmpeg-src-6.1.2-3b624649

      - name: Build LAME and FFmpeg alongside rclone (simulator)
        run: |
          # FFmpeg links against LAME. rclone has separate sources and outputs.
          (./deps/build_lame.sh --simulator && ./deps/build_ffmpeg.sh --simulator) > ffmpeg-simulator.log 2>&1 &
          ffmpeg_pid=$!
          GOMAXPROCS=2 ./deps/build_rclone_ios.sh > rclone-simulator.log 2>&1 &
          rclone_pid=$!
          failed=0
          wait "$ffmpeg_pid" || failed=1
          wait "$rclone_pid" || failed=1
          cat ffmpeg-simulator.log rclone-simulator.log
          exit "$failed"

      - name: Build iSH
        run: |
          export PATH="$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
          ld.lld --version
          ./deps/build_ish.sh release --simulator

