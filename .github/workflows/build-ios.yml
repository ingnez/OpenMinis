      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          sw_vers

      - name: 语音模型目录刷新回归
        run: |
          set -o pipefail
          python3 scripts/test_voice_catalog.py | tee voice-catalog-test.log

      - name: 无上限子代理与实际通话入口回归
        run: |
          set -o pipefail
          python3 scripts/test_build6.py | tee build6-test.log

      - name: 实时语音协议回归与 iOS 类型检查
        run: |
          set -o pipefail
          python3 scripts/test_voice_protocols.py | tee voice-protocols-test.log
          python3 scripts/test_realtime_voice.py | tee realtime-test.log
          python3 scripts/test_dashscope_realtime.py | tee dashscope-realtime-test.log
          python3 scripts/test_local_steer_toggle.py
          xcrun swiftc -swift-version 5 -typecheck -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios16.0 scripts/RealtimeTypecheckSupport.swift src/ios/Views/Chat/AIChatView/Realtime/*.swift 2>&1 | tee realtime-typecheck.log

      - name: 下载并校验官方 VAD 二进制
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_vad.py

      - name: 校验并准备固定版本 SwiftMath 源码
        run: python3 scripts/prepare_swiftmath.py

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.version GIT_CONFIG_VALUE_0=HTTP/1.1
          for attempt in 1 2 3; do
            if xcodebuild -resolvePackageDependencies \
              -project src/ios/Minis.xcodeproj -scheme Minis \
              -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/build/SourcePackages" \
              -scmProvider system -disablePackageRepositoryCache \
              2>&1 | tee package-resolve.log; then
              exit 0
            fi
            rm -rf "$GITHUB_WORKSPACE/build/SourcePackages"
          done
          exit 1

      - name: 验证启动修复和本轮功能
        run: |
          set -euo pipefail
          git diff --check
          xcrun swiftc -typecheck -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios16.0 -application-extension src/ios/Shared/PendingShare.swift src/ios/Shared/SharedContainerStore.swift
          swiftc src/ios/Shared/PendingShare.swift src/ios/Shared/SharedContainerStore.swift scripts/StorageFallbackTests.swift -o /tmp/storage-test
          /tmp/storage-test | tee storage-test.log
          python3 scripts/test_reset.py | tee reset-test.log
          python3 scripts/test_soul_unlimited.py | tee soul-test.log

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Install build dependencies
        run: |
          bash scripts/prepare_mac_build_tools.sh

      - name: Prepare build config
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig

      - name: Build LAME
        run: ./deps/build_lame.sh

      - name: Cache FFmpeg source tarball
        uses: actions/cache@v4
        with:
          path: deps/.cache/ffmpeg-6.1.2.tar.xz
          key: ffmpeg-src-6.1.2-3b624649

      - name: Build FFmpeg
        run: ./deps/build_ffmpeg.sh

      - name: Build iSH
        run: |
          export PATH="$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
          ld.lld --version
          ./deps/build_ish.sh

      - name: Prepare Alpine rootfs
        run: ./deps/prepare_alpine_rootfs.sh

      - name: Build rclone
        run: ./deps/build_rclone_ios.sh

      - name: Build Minis app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/build/SourcePackages" \
            -scmProvider system \
            -disableAutomaticPackageResolution \
            CURRENT_PROJECT_VERSION=13 MARKETING_VERSION=1.16 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Build Apple Watch app (unsigned, embedded into the IPA)
        id: watch
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project src/ios/Minis.xcodeproj \
            -target MinisWatch \
            -configuration Release \
            -sdk watchos \
            SYMROOT="$GITHUB_WORKSPACE/build/watch" \
            CURRENT_PROJECT_VERSION=13 MARKETING_VERSION=1.16 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee watch-build.log
          W=$(find build/watch -maxdepth 3 -name 'MinisWatch.app' -path '*watchos*' | head -n 1)
          test -n "$W"
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          mkdir -p "$APP/Watch"
          cp -R "$W" "$APP/Watch/"
          echo "已嵌入：$APP/Watch/$(basename "$W")"

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          if [ -z "$APP" ]; then
            echo "Minis.app not found" >&2
            find build/Build/Products -maxdepth 3 -name '*.app' >&2
            exit 1
          fi
          echo "Packaging: $APP"
          rm -rf Payload Minis-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          python3 scripts/build_ipa_checklist.py --out 测试清单.md --commit "$(git rev-parse HEAD)"
          cp 测试清单.md "Payload/$(basename "$APP")/"
          zip -qry Minis-unsigned.ipa Payload
          python3 scripts/check_ipa_device_install.py Minis-unsigned.ipa --workspace-tools --watch-widgets
          ls -lh Minis-unsigned.ipa 测试清单.md
          shasum -a 256 Minis-unsigned.ipa | tee SHA256SUMS
          git rev-parse HEAD > SOURCE_COMMIT.txt
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist"

      - name: Check IPA allows 120Hz (ProMotion)
        run: |
          python3 scripts/check_ipa_promotion.py Minis-unsigned.ipa
          python3 scripts/check_ipa_device_install.py --workspace-tools Minis-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Minis-unsigned-ipa
          path: |
            Minis-unsigned.ipa
            测试清单.md
            SHA256SUMS
            SOURCE_COMMIT.txt
            xcodebuild.log
            watch-build.log
            reset-test.log
            soul-test.log
            realtime-test.log
            build6-test.log
            voice-catalog-test.log
            realtime-typecheck.log
            cloud-send-gate-test.log
            cloud-context-test.log
            cloud-chat-test.log
            cloud-model-test.log
            cloud-agent-test.log
            agent-entry.log
            cloud-connection-typecheck.log
            watch-preflight.log
            storage-test.log
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            xcodebuild.log
            package-resolve.log
            cloud-send-gate-test.log
            cloud-context-test.log
            cloud-chat-test.log
            cloud-model-test.log
            cloud-agent-test.log
            agent-entry.log
            cloud-connection-typecheck.log
            watch-preflight.log
            storage-test.log
            reset-test.log
            soul-test.log
            realtime-test.log
            build6-test.log
            voice-catalog-test.log
            realtime-typecheck.log
          if-no-files-found: ignore
          retention-days: 30

  ui-tests:
    if: ${{ inputs.ui_tests && !inputs.quick }}
    needs: [wait-mac]
    runs-on: [self-hosted, macOS, openminis-mac]
    timeout-minutes: 300
    concurrency:
      group: ${{ github.repository }}-macos
      cancel-in-progress: false

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: 使用 Mac-58 已安装的 Xcode 27.0（仅当前任务）
        run: python3 scripts/select_mac58_xcode.py

      - name: 配置 launchd runner 的构建工具路径
        run: |
          for directory in /opt/homebrew/bin /opt/homebrew/sbin /usr/local/bin; do
            if [ -d "$directory" ]; then echo "$directory" >> "$GITHUB_PATH"; fi
          done

      - name: 使用 runner 工具目录内的 CI Python 3.13
        run: bash scripts/prepare_mac_python.sh

      - name: 复用独立的 CI 编译缓存
        run: python3 scripts/prepare_mac_build_cache.py simulator

      - name: iOS 16 API 兼容预检
        run: |
          # 部署目标是 iOS 16：禁止双参数 onChange（iOS 17+）；云端页面里禁止未加 #available 的 iOS 17 专属 API
          if grep -rnE --include='*.swift' 'onChange\(of:[^)]*\) \{ *[_a-zA-Z]+ *, ' src/ios | grep -v '/MinisTests/'; then
            echo "::error::发现 iOS 17 才有的双参数 onChange，请改成 .onChange(of: x) { newValue in ... }"; exit 1
          fi
          if grep -rnE --include='*.swift' 'AVAudioApplication|navigationDestination\(item:|@Observable\b|ContentUnavailableView|\.sensoryFeedback|\.symbolEffect|\.scrollPosition\(' src/ios/Views/Chat/AIChatView/Cloud src/ios/Views/ContentView; then
            echo "::error::云端 / 首页代码使用了 iOS 17+ API，请改用 iOS 16 写法或用 #available 包起来"; exit 1
          fi
          echo "iOS 16 API 预检通过"

      - name: 云端界面提前编译检查
        run: |
          set -o pipefail
          xcrun swiftc -swift-version 5 -whole-module-optimization -emit-sil -o /tmp/cloud-compile-check.sil -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios16.0 scripts/CloudConnectionTypecheckSupport.swift scripts/CloudViewsTypecheckSupport.swift scripts/CloudChatTypecheckSupport.swift scripts/CloudPhase1TypecheckSupport.swift scripts/CloudRealtimeTypecheckSupport.swift src/ios/Views/Chat/AIChatView/Cloud/*.swift src/ios/Views/Chat/AIChatView/Images/*.swift src/ios/WatchShared/*.swift 2>&1 | tee cloud-connection-typecheck.log

      - name: 核验 Mac-58 已安装的 iOS 27.0 模拟器运行环境
        timeout-minutes: 12
        run: |
          set -o pipefail
          python3 scripts/prepare_ios_runtime.py 2>&1 | tee simulator-runtime.log

      - name: 下载并校验官方 VAD 二进制
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_vad.py

      - name: 校验并准备固定版本 SwiftMath 源码
        run: python3 scripts/prepare_swiftmath.py

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.version GIT_CONFIG_VALUE_0=HTTP/1.1
          for attempt in 1 2 3; do
            if xcodebuild -resolvePackageDependencies \
              -project src/ios/Minis.xcodeproj -scheme Minis \
              -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/build/SourcePackages" \
              -scmProvider system -disablePackageRepositoryCache \
              2>&1 | tee package-resolve.log; then
              exit 0
            fi
            rm -rf "$GITHUB_WORKSPACE/build/SourcePackages"
          done
          exit 1

      - name: 创建并验证干净的 iPhone 模拟器
        id: simulator
        timeout-minutes: 12
        run: |
          # Use Mac-58's installed iOS 27.0; do not select the hosted 27.2 Duo runtime.
          # MinisUITests has IPHONEOS_DEPLOYMENT_TARGET = 26.2.
          DEV=$(python3 scripts/pick_ios_simulator.py --prepare \
            --preferred-runtime com.apple.CoreSimulator.SimRuntime.iOS-27-0 \
            --minimum-os 27.0 \
            --maximum-os 27.0.99 \
            --project src/ios/Minis.xcodeproj \
            --scheme Minis \
            --configuration Debug \
            --derived-data build \
            --cloned-source-packages "$GITHUB_WORKSPACE/build/SourcePackages" \
            2> >(tee simulator-boot.log >&2))
          echo "udid=$DEV" >> "$GITHUB_OUTPUT"
          # Suppress the keyboard tutorial if the booted simulator responds.
          python3 - "$DEV" <<'PYTHON'
          import subprocess
          import sys
          for domain in ("com.apple.keyboard.preferences", "com.apple.Preferences"):
              try:
                  subprocess.run(["xcrun", "simctl", "spawn", sys.argv[1], "defaults", "write",
                                  domain, "DidShowContinuousPathIntroduction", "-bool", "true"],
                                 check=True, timeout=12)
              except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as error:
                  print(f"::warning::Could not set keyboard preference: {error}")
          PYTHON

      - name: 云端 Agent 服务回归
        env:
          no_proxy: localhost,127.0.0.1,::1
        id: agent_regression
        if: ${{ inputs.only_testing == '' }}
        run: |
          set -o pipefail
          python3 -m unittest discover -s cloud-agent -p 'test*.py' -v 2>&1 | tee cloud-agent-test.log

      - name: 定向诊断先验证本机流式与可执行交付入口
        id: agent_entry
        if: ${{ inputs.only_testing != '' }}
        timeout-minutes: 3
        env:
          no_proxy: localhost,127.0.0.1,::1
        run: |
          set -o pipefail
          cd cloud-agent
          python3 -m unittest -v \
            test_phase9_speed.LLMClientTests.test_stream_parse_and_keepalive \
            test_phase63_deliver.DeliverUnitTests.test_http_listener_serves_health_without_reverse_dns \
            test_phase63_deliver.DeliverExecutableTests 2>&1 | tee ../agent-entry.log

      - name: 云端 Agent 服务集成验证与资源打包
        run: |
          set -o pipefail
          python3 scripts/prepare_cloud_agent.py
          swiftc -swift-version 5 src/ios/Views/Chat/AIChatView/Cloud/CloudContextFiles.swift scripts/CloudContextFilesTests.swift -o /tmp/cloud-context-tests
          /tmp/cloud-context-tests | tee cloud-context-test.log
