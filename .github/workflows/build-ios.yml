          echo "$GITHUB_SHA" > ui-suites/SOURCE_COMMIT.txt
          exit "$ui_exit"

      - name: Upload FrogP0UITests progress immediately
        if: ${{ always() && inputs.only_testing == '' && steps.unit.outcome != 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: Minis-ui-progress-FrogP0UITests
          path: |
            ui-suites/FrogP0UITests.log
            ui-suites/FrogP0UITests-summary.md
            ui-suites/SOURCE_COMMIT.txt
          retention-days: 7

      - name: XCUITest Frog1850UITests (12/15)
        continue-on-error: true
        if: ${{ inputs.only_testing == '' && steps.unit.outcome != 'failure' }}
        timeout-minutes: 45
        env:
          DEV: ${{ steps.simulator.outputs.udid }}
          ONLY_TESTING: MinisUITests/Frog1850UITests
          RESULT_BUNDLE: ui-suites/Frog1850UITests.xcresult
          UI_LOG: ui-suites/Frog1850UITests.log
        run: |
          set +e
          bash scripts/run_ios_ui_tests.sh
          ui_exit=$?
          python3 scripts/e2e_summary.py "$UI_LOG" > "${UI_LOG%.log}-summary.md"
          echo "$GITHUB_SHA" > ui-suites/SOURCE_COMMIT.txt
          exit "$ui_exit"

      - name: Upload Frog1850UITests progress immediately
        if: ${{ always() && inputs.only_testing == '' && steps.unit.outcome != 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: Minis-ui-progress-Frog1850UITests
          path: |
            ui-suites/Frog1850UITests.log
            ui-suites/Frog1850UITests-summary.md
            ui-suites/SOURCE_COMMIT.txt
          retention-days: 7

      - name: XCUITest Frog1850Chunk2UITests (13/15)
        continue-on-error: true
        if: ${{ inputs.only_testing == '' && steps.unit.outcome != 'failure' }}
        timeout-minutes: 45
        env:
          DEV: ${{ steps.simulator.outputs.udid }}
          ONLY_TESTING: MinisUITests/Frog1850Chunk2UITests
          RESULT_BUNDLE: ui-suites/Frog1850Chunk2UITests.xcresult
          UI_LOG: ui-suites/Frog1850Chunk2UITests.log
        run: |
          set +e
          bash scripts/run_ios_ui_tests.sh
          ui_exit=$?
          python3 scripts/e2e_summary.py "$UI_LOG" > "${UI_LOG%.log}-summary.md"
          echo "$GITHUB_SHA" > ui-suites/SOURCE_COMMIT.txt
          exit "$ui_exit"

      - name: Upload Frog1850Chunk2UITests progress immediately
        if: ${{ always() && inputs.only_testing == '' && steps.unit.outcome != 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: Minis-ui-progress-Frog1850Chunk2UITests
          path: |
            ui-suites/Frog1850Chunk2UITests.log
            ui-suites/Frog1850Chunk2UITests-summary.md
            ui-suites/SOURCE_COMMIT.txt
          retention-days: 7

      - name: XCUITest Frog1850Chunk3UITests (14/15)
        continue-on-error: true
        if: ${{ inputs.only_testing == '' && steps.unit.outcome != 'failure' }}
        timeout-minutes: 45
        env:
          DEV: ${{ steps.simulator.outputs.udid }}
          ONLY_TESTING: MinisUITests/Frog1850Chunk3UITests
          RESULT_BUNDLE: ui-suites/Frog1850Chunk3UITests.xcresult
          UI_LOG: ui-suites/Frog1850Chunk3UITests.log
        run: |
          set +e
          bash scripts/run_ios_ui_tests.sh
          ui_exit=$?
          python3 scripts/e2e_summary.py "$UI_LOG" > "${UI_LOG%.log}-summary.md"
          echo "$GITHUB_SHA" > ui-suites/SOURCE_COMMIT.txt
          exit "$ui_exit"

      - name: Upload Frog1850Chunk3UITests progress immediately
        if: ${{ always() && inputs.only_testing == '' && steps.unit.outcome != 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: Minis-ui-progress-Frog1850Chunk3UITests
          path: |
            ui-suites/Frog1850Chunk3UITests.log
            ui-suites/Frog1850Chunk3UITests-summary.md
            ui-suites/SOURCE_COMMIT.txt
          retention-days: 7

      - name: XCUITest BackupUXUITests (15/15)
        continue-on-error: true
        if: ${{ inputs.only_testing == '' && steps.unit.outcome != 'failure' }}
        timeout-minutes: 45
        env:
          DEV: ${{ steps.simulator.outputs.udid }}
          ONLY_TESTING: MinisUITests/BackupUXUITests
          RESULT_BUNDLE: ui-suites/BackupUXUITests.xcresult
          UI_LOG: ui-suites/BackupUXUITests.log
        run: |
          set +e
          bash scripts/run_ios_ui_tests.sh
          ui_exit=$?
          python3 scripts/e2e_summary.py "$UI_LOG" > "${UI_LOG%.log}-summary.md"
          echo "$GITHUB_SHA" > ui-suites/SOURCE_COMMIT.txt
          exit "$ui_exit"

      - name: Upload BackupUXUITests progress immediately
        if: ${{ always() && inputs.only_testing == '' && steps.unit.outcome != 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: Minis-ui-progress-BackupUXUITests
          path: |
            ui-suites/BackupUXUITests.log
            ui-suites/BackupUXUITests-summary.md
            ui-suites/SOURCE_COMMIT.txt
          retention-days: 7

      - name: 定向 XCUITest（模拟器）
        id: ui_targeted
        if: ${{ inputs.only_testing != '' && steps.unit.outcome != 'failure' }}
        timeout-minutes: 150
        env:
          ONLY_TESTING: ${{ inputs.only_testing }}
          DEV: ${{ steps.simulator.outputs.udid }}
        run: bash scripts/run_ios_ui_tests.sh

      - name: 汇总完整 UI 套件及具名用例
        id: ui_complete
        if: ${{ always() && inputs.only_testing == '' && steps.unit.outcome != 'failure' }}
        run: python3 scripts/merge_ios_ui_results.py

      - name: XCUITest 端到端冒烟（模拟器）
        id: ui_e2e
        if: ${{ always() && steps.unit.outcome != 'failure' }}
        env:
          FULL_RESULT: ${{ steps.ui_complete.outcome }}
          TARGET_RESULT: ${{ steps.ui_targeted.outcome }}
          ONLY_TESTING: ${{ inputs.only_testing }}
        run: |
          if [ -z "$ONLY_TESTING" ]; then test "$FULL_RESULT" = success; else test "$TARGET_RESULT" = success; fi

      - name: 先汇总具名 UI 结果
        if: always()
        run: |
          echo "$GITHUB_SHA" > ui-validation-source.txt
          if [ ! -f ui-tests.log ]; then
            echo 'UI tests did not execute; inspect prerequisite logs.' > e2e-summary.md
            exit 0
          fi
          xcrun xcresulttool get test-results summary --path ui-tests.xcresult --format json > ui-tests-summary.json 2>/dev/null || true
          xcrun xcresulttool get test-results tests --path ui-tests.xcresult --format json > ui-tests-tests.json 2>/dev/null || true
          python3 scripts/e2e_summary.py ui-tests.log ui-tests-summary.json ui-tests-tests.json > e2e-summary.md || true
          cat e2e-summary.md

      # Text evidence stays small even when XCTest has recorded long videos.
      # Publish verdicts before exporting/uploading those large attachments.
      - name: Upload concise UI diagnostics first
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Minis-e2e-early
          path: |
            ui-validation-source.txt
            e2e-summary.md
            ui-tests-summary.json
            ui-tests-tests.json
            ui-tests.log
            ui-suites/*.log
            ui-merge-failure
            agent-entry.log
            fixture-reset.log
          retention-days: 7

      - name: 导出完整 UI 截图和录屏
        if: always()
        run: |
          mkdir -p e2e-shots
          xcrun xcresulttool export attachments --path ui-tests.xcresult --output-path e2e-shots 2>&1 | tail -3 || true
          ls e2e-shots | head -50

      - name: 定向 UI 通过后的 Agent 完整回归
        id: agent_diagnostic_regression
        if: ${{ inputs.only_testing != '' && steps.ui_e2e.outcome == 'success' }}
        env:
          no_proxy: localhost,127.0.0.1,::1
        run: |
          set -o pipefail
          python3 -m unittest discover -s cloud-agent -p 'test*.py' -v 2>&1 | tee cloud-agent-test.log

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Minis-ui-tests
          path: |
            ui-tests.log
            ui-suites/*.log
            ui-merge-failure
            ui-tests.xcresult
            fixture-reset.log
            e2e-summary.md
            ui-tests-summary.json
            ui-tests-tests.json
            e2e-shots
            !e2e-shots/**/*.mp4
            !e2e-shots/**/*.mov
            e2e-cloud-stack.log
            simulator-boot.log
            ffmpeg-simulator.log
            rclone-simulator.log
            hang-samples
            unit-tests.log
            cloud-agent-test.log
            agent-entry.log
            cloud-connection-typecheck.log
            watch-preflight.log
          retention-days: 14

      - name: 清理专用 CI 模拟器的测试应用
        if: ${{ always() && steps.simulator.outputs.udid != '' }}
        env:
          DEV: ${{ steps.simulator.outputs.udid }}
        run: python3 scripts/cleanup_ci_simulator.py "$DEV"

      - name: Agent 回归必须通过（先保存定向 UI 诊断证据再判定）
        if: ${{ always() && (steps.agent_regression.outcome == 'failure' || steps.agent_diagnostic_regression.outcome == 'failure' || steps.agent_entry.outcome == 'failure') }}
        run: |
          echo '::error::Agent regression failed; UI diagnostic evidence does not make this job pass.'
          exit 1

      - name: MinisTests 必须全部通过（先传完日志再判定）
        if: always() && steps.unit.outcome == 'failure'
        run: |
          echo "::error::MinisTests 有失败，见 unit-tests.log 的 Failing tests"
          grep -A40 "Failing tests:" unit-tests.log | head -45 || true
          exit 1
