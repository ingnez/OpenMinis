        run: ./deps/prepare_alpine_rootfs.sh

      - name: 启动本地云端 Agent + 假模型（给端到端流程用）
        env:
          no_proxy: localhost,127.0.0.1,::1
        run: |
          set -euo pipefail
          python3 scripts/e2e_cloud_stack.py "$RUNNER_TEMP/openminis-e2e" > e2e-cloud-stack.log 2>&1 &
          for i in $(seq 1 60); do grep -q "E2E 云端就绪" e2e-cloud-stack.log && break; sleep 1; done
          cat e2e-cloud-stack.log
          grep -q "E2E 云端就绪" e2e-cloud-stack.log
          python3 scripts/test_e2e_fixture_reset.py 2>&1 | tee fixture-reset.log

      # Fail at the shared entry point before spending hours retrying dependent flows.
      # Explicit subsets still run exactly the requested methods.
      - name: 编译 Watch App 与实际嵌入的表盘小组件
        run: |
          set -o pipefail
          xcodebuild -project src/ios/Minis.xcodeproj -target MinisWatch -configuration Debug -sdk watchos \
            SYMROOT="$RUNNER_TEMP/openminis-watch-preflight" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee watch-preflight.log
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from check_watch_bundle import verify
          products = list(Path(os.environ['RUNNER_TEMP'], 'openminis-watch-preflight').glob('**/MinisWatch.app'))
          assert len(products) == 1, f'Expected one built Watch app, got {len(products)}'
          verify(products[0])
          PYTHON

      - name: 聊天入口预检（打开 Bot、输入、真实回复）
        id: ui_entry
        if: ${{ inputs.only_testing == '' }}
        timeout-minutes: 45
        env:
          DEV: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          directory = Path('src/ios/Minis.xcodeproj/xcshareddata/xcschemes')
          original = (directory / 'Minis.xcscheme').read_text()
          smoke = re.sub(r'\s*<TestableReference[^>]*>(?:(?!</TestableReference>).)*?BlueprintName = "MinisTests"(?:(?!</TestableReference>).)*?</TestableReference>', '', original, flags=re.S)
          assert smoke != original and 'MinisUITests' in smoke
          (directory / 'MinisE2E.xcscheme').write_text(smoke)
          PY
          xcodebuild test \
            -project src/ios/Minis.xcodeproj -scheme MinisE2E -configuration Debug \
            -destination "id=$DEV" -derivedDataPath build \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/build/SourcePackages" \
            -scmProvider system -disableAutomaticPackageResolution \
            -only-testing:MinisUITests/E2EFlowsUITests/test01_sendText \
            -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 150 \
            -maximum-test-execution-time-allowance 240 -parallel-testing-enabled NO \
            -resultBundlePath ui-entry.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= 2>&1 | tee ui-entry.log
          xcrun xcresulttool get test-results summary --path ui-entry.xcresult --format json > ui-entry-summary.json
          python3 - <<'PY'
          import json
          result = json.load(open('ui-entry-summary.json'))
          assert result.get('passedTests') == 1 and result.get('failedTests') == 0, result
          assert result.get('skippedTests', 0) == 0, result
          print('Chat entry: 1 actual test passed; no failures or skips')
          PY
          git rev-parse HEAD > UI_ENTRY_SOURCE_COMMIT.txt

