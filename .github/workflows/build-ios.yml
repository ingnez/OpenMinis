          python3 scripts/test_dashscope_realtime.py | tee dashscope-realtime-test.log
          python3 scripts/test_local_steer_toggle.py
          xcrun swiftc -swift-version 5 -typecheck -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios16.0 scripts/RealtimeTypecheckSupport.swift src/ios/Views/Chat/AIChatView/Realtime/*.swift 2>&1 | tee realtime-typecheck.log

      - name: 下载并校验官方 VAD 二进制
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_vad.py

      - name: 校验并准备固定版本 SwiftMath 源码
        run: python3 scripts/prepare_swiftmath.py

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          git config --global http.version HTTP/1.1
          for attempt in 1 2 3; do
            if xcodebuild -resolvePackageDependencies \
              -project src/ios/Minis.xcodeproj -scheme Minis \
              -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/build/SourcePackages" \
              -scmProvider system -disablePackageRepositoryCache \
              2>&1 | tee package-resolve.log; then
              exit 0
            fi
            rm -rf "$GITHUB_WORKSPACE/build/SourcePackages"
          done
          exit 1

      - name: 验证启动修复和本轮功能
        run: |
          set -euo pipefail
          git diff --check
          xcrun swiftc -typecheck -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios16.0 -application-extension src/ios/Shared/PendingShare.swift src/ios/Shared/SharedContainerStore.swift
          swiftc src/ios/Shared/PendingShare.swift src/ios/Shared/SharedContainerStore.swift scripts/StorageFallbackTests.swift -o /tmp/storage-test
          /tmp/storage-test | tee storage-test.log
          python3 scripts/test_reset.py | tee reset-test.log
          python3 scripts/test_soul_unlimited.py | tee soul-test.log

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Install build dependencies
        run: |
          brew install ninja llvm lld libarchive pkg-config
          python3 -m pip install --break-system-packages meson
          echo "LLVM prefix: $(brew --prefix llvm)"
          meson --version

      - name: Ensure Metal toolchain
        run: |
          if ! xcrun --sdk iphoneos metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk iphoneos metal --version

      - name: Prepare build config
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig

      - name: Build LAME
        run: ./deps/build_lame.sh --simulator

      - name: Cache FFmpeg source tarball
        uses: actions/cache@v4
        with:
          path: deps/.cache/ffmpeg-6.1.2.tar.xz
          key: ffmpeg-src-6.1.2-3b624649

      - name: Build FFmpeg
        run: ./deps/build_ffmpeg.sh --simulator

      - name: Build iSH
        run: |
          export PATH="$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
          ld.lld --version
          ./deps/build_ish.sh release --simulator

      - name: Prepare Alpine rootfs
        run: ./deps/prepare_alpine_rootfs.sh

      - name: Build rclone
        run: ./deps/build_rclone_ios.sh

      - name: 启动本地云端 Agent + 假模型（给端到端流程用）
        run: |
          python3 scripts/e2e_cloud_stack.py "$RUNNER_TEMP/openminis-e2e" > e2e-cloud-stack.log 2>&1 &
          for i in $(seq 1 60); do grep -q "E2E 云端就绪" e2e-cloud-stack.log && break; sleep 1; done
          cat e2e-cloud-stack.log
          grep -q "E2E 云端就绪" e2e-cloud-stack.log

      - name: XCUITest 端到端冒烟（模拟器）
        # 卡住时尽快失败：整步最多 80 分钟（编译约 20 分钟 + 模拟器启动约 3 分钟 + 17 个流程串行约 30 分钟 + 失败重试），单个测试默认 150 秒、最多 240 秒（xcodebuild 会把超时的测试记成失败并截图）
        # 不用并行克隆模拟器（克隆冷启动「Timed out while launching application」）；失败的流程自动重试一次，汇总里注明重试次数
        timeout-minutes: 80
        run: |
          set -o pipefail
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "模拟器：$DEV"
          xcrun simctl boot "$DEV" || true
          # 关掉系统键盘的「滑行输入」新手引导（Speed up your typing… Continue），它会盖住下半屏挡住后面的点按
          xcrun simctl bootstatus "$DEV" -b || true
          xcrun simctl spawn "$DEV" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true || true
          xcrun simctl spawn "$DEV" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool true || true
          # Minis 方案里挂着的 MinisTests 只依赖 MinisTestHost、不依赖 Minis（设计上走 MinisUnitTests 方案、先单独编 App，
          # 见 scripts/ios-unit-tests.sh），并行编译时扫描不到 Minis 模块就报「Unable to resolve module dependency: 'Minis'」，
          # -only-testing 也挡不住它被编译。这里只在运行机上生成一个不含它的方案跑 UI 流程；单元测试在下一步按它自己的方案跑。
          python3 - <<'PY'
          import re
          d = "src/ios/Minis.xcodeproj/xcshareddata/xcschemes/"
          s = open(d + "Minis.xcscheme").read()
          s2 = re.sub(r"\s*<TestableReference[^>]*>(?:(?!</TestableReference>).)*?BlueprintName = \"MinisTests\"(?:(?!</TestableReference>).)*?</TestableReference>", "", s, flags=re.S)
          assert s2 != s and "MinisUITests" in s2
          open(d + "MinisE2E.xcscheme", "w").write(s2)
          PY
          xcodebuild test \
            -project src/ios/Minis.xcodeproj \
            -scheme MinisE2E \
            -configuration Debug \
            -destination "id=$DEV" \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/build/SourcePackages" \
            -scmProvider system \
            -disableAutomaticPackageResolution \
            -only-testing:MinisUITests/MinisSmokeUITests \
            -only-testing:MinisUITests/ComposerVoiceButtonUITests \
            -only-testing:MinisUITests/E2EFlowsUITests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 150 \
            -maximum-test-execution-time-allowance 240 \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath ui-tests.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= | tee ui-tests.log

      - name: 端到端流程结果与截图
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path ui-tests.xcresult --format json > ui-tests-summary.json 2>/dev/null || true
          xcrun xcresulttool get test-results tests --path ui-tests.xcresult --format json > ui-tests-tests.json 2>/dev/null || true
          python3 scripts/e2e_summary.py ui-tests.log ui-tests-summary.json ui-tests-tests.json > e2e-summary.md || true
          cat e2e-summary.md
          mkdir -p e2e-shots
          xcrun xcresulttool export attachments --path ui-tests.xcresult --output-path e2e-shots 2>&1 | tail -3 || true
          ls e2e-shots | head -50

      - name: iOS 单元测试 MinisTests（模拟器，MinisUnitTests 方案）
        id: unit
        if: always()
        continue-on-error: true
        timeout-minutes: 30
        run: |
          set -o pipefail
          # 和 UI 测试同一台模拟器（上一步结束后它可能已被关掉，所以不按「已启动」找）
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$DEV" 2>/dev/null || true
          echo "模拟器：$DEV"
          # Minis.app（带 Minis.debug.dylib）上一步已经编进 build/；MinisTests 链接它，跑在 MinisTestHost 里
          xcodebuild test \
            -project src/ios/Minis.xcodeproj \
            -scheme MinisUnitTests \
            -configuration Debug \
            -destination "id=$DEV" \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/build/SourcePackages" \
            -scmProvider system \
            -disableAutomaticPackageResolution \
            -resultBundlePath unit-tests.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= 2>&1 | tee unit-tests.log
          grep -E "Executed [0-9]+ tests" unit-tests.log | tail -1 || true

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Minis-ui-tests
          path: |
            ui-tests.log
            ui-tests.xcresult
            e2e-summary.md
            ui-tests-summary.json
            ui-tests-tests.json
            e2e-shots
            e2e-cloud-stack.log
            unit-tests.log
          retention-days: 14

      - name: MinisTests 必须全部通过（先传完日志再判定）
        if: always() && steps.unit.outcome == 'failure'
        run: |
          echo "::error::MinisTests 有失败，见 unit-tests.log 的 Failing tests"
          grep -A40 "Failing tests:" unit-tests.log | head -45 || true
          exit 1
