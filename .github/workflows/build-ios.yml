name: Build Minis iOS IPA (unsigned)

on:
  workflow_dispatch:
    inputs:
      quick:
        description: "只跑几分钟的云端 Swift 快速类型检查（推送前预检），不构建 IPA"
        type: boolean
        default: false
      ui_tests:
        description: "在 Mac-58 的 iOS 27.0 模拟器上跑 XCUITest，不出 IPA"
        type: boolean
        default: false
      only_testing:
        description: "只跑这些 XCUITest（传给 xcodebuild -only-testing，逗号或换行分隔，例如 MinisUITests/E2EFlowsUITests/test25_CC_pinchZoomAndClipboard）。留空则跑全部允许的 UI 流程，并接着跑 MinisTests"
        type: string
        default: ""
      mac_runner:
        description: "固定使用仓库自托管 Mac-58；不使用 GitHub 托管 macOS"
        type: choice
        options: [openminis-mac]
        default: openminis-mac
      mac_retry:
        description: "兼容旧调度参数；固定为 0，不自动切换机器"
        type: string
        default: "0"

permissions:
  contents: read

jobs:
  # 每次触发都至少跑这一个任务：其余任务都按 quick 输入跳过时，GitHub 会把整次运行报成「No jobs were run」失败
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "mode=${{ inputs.quick && 'quick-typecheck' || 'full-build' }} ref=${{ github.ref_name }} sha=${{ github.sha }}"


  # All Mac jobs use the single repository runner Mac-58 and the shared concurrency group.
  # 所有 Mac 任务共用仓库级 concurrency（cancel-in-progress: false）：第二个会 pending，
  # 不会跟第一个一起挤进 15 分钟领机器窗口。先在 Linux 上等到本仓库没有其他 Mac 任务，
  # 再去排队；非主线还会给 grokbot-phase2 让路。若仍领不到，见文末自动重排。
  wait-mac:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    steps:
      - name: 等到本仓库没有其他 macOS 任务在跑或在领机器
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json, os, time, urllib.error, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          me = str(os.environ["GITHUB_RUN_ID"])
          token = os.environ["GH_TOKEN"]
          branch = os.environ.get("GITHUB_REF_NAME") or ""
          main_branch = "grokbot-phase2"
          deadline = time.time() + 170 * 60

          def api(path):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "openminis-wait-mac",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def list_runs():
              seen, out = set(), []
              # 只查 in_progress 会漏掉整次运行还在 queued 的（Mac 任务已排队但 Linux 已结束）。
              for st in ("in_progress", "queued", "waiting", "pending"):
                  try:
                      batch = (api(f"/actions/runs?status={st}&per_page=30").get("workflow_runs") or [])
                  except urllib.error.HTTPError as e:
                      if e.code == 422:
                          continue
                      raise
                  for run in batch:
                      rid = run.get("id")
                      if rid in seen:
                          continue
                      seen.add(rid)
                      out.append(run)
              return out

          clear_since = None
          while time.time() < deadline:
              try:
                  busy = []
                  for run in list_runs():
                      if str(run.get("id")) == me:
                          continue
                      jobs = (api(f"/actions/runs/{run['id']}/jobs?per_page=50").get("jobs") or [])
                      for j in jobs:
                          labels = " ".join(j.get("labels") or []).lower()
                          if "macos" not in labels:
                              continue
                          if j.get("status") in ("queued", "in_progress", "waiting", "pending"):
                              busy.append(f"{run['id']}/{j.get('name')} {j.get('status')} {labels}")
                      # 非主线给主线让路：主线刚派发时可能还在 wait-mac，Mac 任务尚未出现。
                      # 主线本身不抢已经在跑或在领机器的其他任务（由 concurrency 排队，不取消）。
                      if branch != main_branch and run.get("head_branch") == main_branch:
                          rid = str(run.get("id"))
                          if run.get("status") in ("in_progress", "queued", "waiting", "pending") and not any(x.startswith(rid + "/") for x in busy):
                              busy.append(f"{rid} 主线 {run.get('head_branch')} {run.get('status')}（让主线先领 Mac）")
                  if not busy:
                      if clear_since is None:
                          clear_since = time.time()
                          print("暂无其他 macOS 任务，再确认一次以免刚派发的跑空", flush=True)
                          time.sleep(20)
                          continue
                      print("没有其他 macOS 任务在跑，开始领机器", flush=True)
                      break
                  clear_since = None
                  print("仍在等：", flush=True)
                  for line in busy:
                      print("  " + line, flush=True)
              except urllib.error.HTTPError as e:
                  print(f"查询失败 HTTP {e.code}，稍后重试", flush=True)
                  time.sleep(90)
                  continue
              time.sleep(60)
          else:
              print("等到上限仍有任务，继续尝试领机器", flush=True)
          PY

  # 只放必须用 Xcode / iOS SDK 的检查。其余检查放到下面的 Linux 任务里，几分钟就有结果。
  quick-typecheck:
    if: ${{ inputs.quick }}
    needs: [wait-mac]
    runs-on: [self-hosted, macOS, openminis-mac]
    timeout-minutes: 20
    concurrency:
      group: ${{ github.repository }}-macos
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 使用 Mac-58 已安装的 Xcode 27.0（仅当前任务）
        run: python3 scripts/select_mac58_xcode.py

      - name: 配置 launchd runner 的构建工具路径
        run: |
          for directory in /opt/homebrew/bin /opt/homebrew/sbin /usr/local/bin; do
            if [ -d "$directory" ]; then echo "$directory" >> "$GITHUB_PATH"; fi
          done

      - name: 使用 runner 工具目录内的 CI Python 3.13
        run: bash scripts/prepare_mac_python.sh
      - name: Swift 文件都在 Xcode 工程里
        run: python3 scripts/check_xcode_membership.py
      - name: 实时语音协议回归与 iOS 类型检查
        run: |
          set -o pipefail
          python3 scripts/test_voice_protocols.py
          python3 scripts/test_realtime_voice.py
          python3 scripts/test_voice_catalog.py
          python3 scripts/test_dashscope_realtime.py
          python3 scripts/test_local_steer_toggle.py
          xcrun swiftc -swift-version 5 -typecheck -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios16.0 scripts/RealtimeTypecheckSupport.swift src/ios/Views/Chat/AIChatView/Realtime/*.swift 2>&1 | tee realtime-typecheck.log
      - name: iOS 16 API 兼容预检
        run: |
          if grep -rnE --include='*.swift' 'onChange\(of:[^)]*\) \{ *[_a-zA-Z]+ *, ' src/ios | grep -v '/MinisTests/'; then
            echo "::error::发现 iOS 17 才有的双参数 onChange"; exit 1
          fi
          if grep -rnE --include='*.swift' 'AVAudioApplication|navigationDestination\(item:|@Observable\b|ContentUnavailableView|\.sensoryFeedback|\.symbolEffect|\.scrollPosition\(' src/ios/Views/Chat/AIChatView/Cloud src/ios/Views/ContentView; then
            echo "::error::云端 / 首页代码使用了 iOS 17+ API"; exit 1
          fi
      - name: 云端 Swift 类型检查（iOS 16 目标）
        timeout-minutes: 12
        run: |
          set -o pipefail
          python3 scripts/check_cloud_no_intents_refs.py
          xcrun swiftc -swift-version 5 -whole-module-optimization -emit-sil -o /tmp/cloud-compile-check.sil -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios16.0 scripts/CloudConnectionTypecheckSupport.swift scripts/CloudViewsTypecheckSupport.swift scripts/CloudChatTypecheckSupport.swift scripts/CloudPhase1TypecheckSupport.swift scripts/CloudRealtimeTypecheckSupport.swift src/ios/Views/Chat/AIChatView/Cloud/*.swift src/ios/Views/Chat/AIChatView/Images/*.swift src/ios/WatchShared/*.swift src/ios/Agent/Intents/CloudIntents.swift src/ios/AgentWidget/CloudBotsWidget.swift src/ios/AgentWidget/CloudVoiceControl.swift 2>&1 | tee cloud-typecheck.log
      - name: 纯逻辑 Swift 单测在 macOS 上也能编译（CoreGraphics 差异只在 Mac 上暴露）
        run: |
          set -e
          grep -oE 'swiftc -swift-version 5 (-parse-as-library |scripts/CloudChatTypecheckSupport\.swift scripts/CloudCardsStub)[^|]*-o /tmp/[A-Za-z0-9_-]+' .github/workflows/build-ios.yml | grep -v '^xcrun' | sort -u > /tmp/swift-unit-cmds.txt
          wc -l < /tmp/swift-unit-cmds.txt
          while read -r c; do xcrun $c || { echo "::error::$c"; exit 1; }; done < /tmp/swift-unit-cmds.txt
      - name: Apple Watch App 类型检查（watchOS SDK）
        run: |
          set -o pipefail
          xcrun --sdk watchos --show-sdk-version
          xcrun swiftc -swift-version 5 -typecheck -sdk "$(xcrun --sdk watchos --show-sdk-path)" -target arm64_32-apple-watchos9.0 src/ios/MinisWatch/*.swift src/ios/WatchShared/*.swift 2>&1 | tee watch-typecheck.log

  # 与平台无关的快速检查：Python 脚本、只依赖 Foundation 的 Swift 规则测试、云端服务全部单元测试。Linux 机器基本不用排队。
  quick-linux:
    if: ${{ inputs.quick || inputs.ui_tests }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift 工具链
        run: swiftc --version
      - name: 本地模式没有云端入口
        run: python3 scripts/check_local_cloud_entry.py
      - name: Bot 模式设置入口
        run: python3 scripts/check_bot_settings_entry.py
      - name: 类型检查替身与真实声明一致
        run: python3 scripts/check_typecheck_stubs.py
      - name: 云端目录不引用只在 Intents / Widget 里的声明（完整构建的云端类型检查不含这两处）
        run: python3 scripts/check_cloud_no_intents_refs.py
      - name: 断线重连逻辑测试
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudReconnectPolicy.swift scripts/CloudReconnectTests.swift -o /tmp/cloud-reconnect-tests
          /tmp/cloud-reconnect-tests
      - name: 回复耗时只挂在产生它的任务上
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudLatency.swift scripts/CloudLatencyTests.swift -o /tmp/cloud-latency-tests
          /tmp/cloud-latency-tests
      - name: Bot 对话步骤条模型测试
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudStepFeed.swift scripts/CloudStepFeedTests.swift -o /tmp/cloud-step-tests
          /tmp/cloud-step-tests
      - name: 头像深浅色对比度测试
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudAvatarPalette.swift scripts/CloudAvatarPaletteTests.swift -o /tmp/cloud-avatar-tests
          /tmp/cloud-avatar-tests
      - name: 编辑 Bot 乐观保存测试
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudBotEditPatch.swift scripts/CloudBotEditPatchTests.swift -o /tmp/cloud-editpatch-tests
          /tmp/cloud-editpatch-tests
      - name: 表情回应测试
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudReactionLogic.swift scripts/CloudReactionLogicTests.swift -o /tmp/cloud-reaction-tests
          /tmp/cloud-reaction-tests
      - name: Bot 间对话线程测试
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudBotThreads.swift scripts/CloudBotThreadsTests.swift -o /tmp/cloud-threads-tests
          /tmp/cloud-threads-tests
      - name: 对话缓存（秒开）测试
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudChatCache.swift scripts/CloudChatCacheTests.swift -o /tmp/cloud-chatcache-tests
          /tmp/cloud-chatcache-tests
      - name: 每日用量图数据测试
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudUsageSeries.swift scripts/CloudUsageSeriesTests.swift -o /tmp/cloud-usage-series-tests
          /tmp/cloud-usage-series-tests
      - name: 头像心情测试
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudBotMood.swift scripts/CloudBotMoodTests.swift -o /tmp/cloud-mood-tests
          /tmp/cloud-mood-tests
      - name: 错误日志格式测试
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudErrorLogFormat.swift src/ios/Views/Chat/AIChatView/Cloud/CloudReconnectPolicy.swift scripts/CloudErrorLogTests.swift -o /tmp/cloud-errorlog-tests
          /tmp/cloud-errorlog-tests
      - name: 拍照分派测试
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudPhotoRouter.swift scripts/CloudPhotoRouterTests.swift -o /tmp/cloud-photo-router-tests
          /tmp/cloud-photo-router-tests
      - name: 实时资源面板测试
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudLiveStats.swift scripts/CloudLiveStatsTests.swift -o /tmp/cloud-livestats-tests
          /tmp/cloud-livestats-tests
      - name: 录屏回放测试
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudReplay.swift scripts/CloudReplayTests.swift -o /tmp/cloud-replay-tests
          /tmp/cloud-replay-tests
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudShiftSupport.swift scripts/CloudShiftSupportTests.swift -o /tmp/cloud-shift-support-tests
          /tmp/cloud-shift-support-tests
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudPocketMode.swift scripts/CloudPocketModeTests.swift -o /tmp/cloud-pocket-mode-tests
          /tmp/cloud-pocket-mode-tests
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudPromptTemplates.swift scripts/CloudPromptTemplatesTests.swift -o /tmp/cloud-prompt-templates-tests
          /tmp/cloud-prompt-templates-tests
      - name: 病例脱敏测试
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudCaseRedactor.swift scripts/CloudCaseRedactorTests.swift -o /tmp/cloud-caseredact-tests
          /tmp/cloud-caseredact-tests
      - name: 输入框变形按钮状态机测试
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudBotComposerAction.swift src/ios/Views/Chat/AIChatView/Realtime/RealtimeLevelMeter.swift scripts/CloudBotComposerTests.swift -o /tmp/cloud-composer-tests
          /tmp/cloud-composer-tests
      - name: 保管库界面逻辑测试
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudVaultModel.swift scripts/CloudVaultModelTests.swift -o /tmp/cloud-vault-model-tests
          /tmp/cloud-vault-model-tests
      - name: 图片叠卡与看图页逻辑测试
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Images/ImageStackLayout.swift scripts/ImageStackLayoutTests.swift -o /tmp/image-stack-tests
          /tmp/image-stack-tests
      - name: 本地通话分隔线测试
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Realtime/LocalCallDivider.swift scripts/LocalCallDividerTests.swift -o /tmp/local-call-divider-tests
          /tmp/local-call-divider-tests
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Realtime/RealtimeVoiceProtocol.swift scripts/RealtimeCallHealthTests.swift -o /tmp/rt-health-tests
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudShapeOutline.swift scripts/CloudShapeOutlineTests.swift -o /tmp/shape-outline-tests
          /tmp/rt-health-tests
          /tmp/shape-outline-tests
      - name: Bot 对话分页测试
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudHistoryPager.swift scripts/CloudHistoryPagerTests.swift -o /tmp/cloud-history-pager-tests
          /tmp/cloud-history-pager-tests
      - name: 群聊语音轮流规则测试
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudGroupVoiceRules.swift scripts/CloudGroupVoiceTests.swift -o /tmp/cloud-group-voice-tests
          /tmp/cloud-group-voice-tests
      - name: 群聊 G1-G11 规则测试
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudGroupRules.swift scripts/CloudGroupRulesTests.swift -o /tmp/cloud-group-rules-tests
          /tmp/cloud-group-rules-tests
      - name: 工作流画布逻辑测试
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudWorkflowGraph.swift scripts/CloudWorkflowGraphTests.swift -o /tmp/cloud-workflow-graph-tests
          /tmp/cloud-workflow-graph-tests
      - name: 多台云电脑测试
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudServerProfiles.swift scripts/CloudServerProfilesTests.swift -o /tmp/cloud-server-profiles-tests
          /tmp/cloud-server-profiles-tests
      - name: 首页正在回复测试
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudTypingPhase.swift scripts/CloudTypingPhaseTests.swift -o /tmp/cloud-typing-phase-tests
          /tmp/cloud-typing-phase-tests
      - name: 手表数据测试
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/WatchShared/WatchPayload.swift scripts/WatchPayloadTests.swift -o /tmp/watch-payload-tests
          /tmp/watch-payload-tests
      - name: 云电脑接管纯逻辑测试（触控板 / 缩放跟随 / 按键 / 输入法 / 画质 / 计时）
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudDesktopInput.swift scripts/CloudDesktopInputTests.swift -o /tmp/cloud-desktop-input-tests
          /tmp/cloud-desktop-input-tests
      - name: 交付卡片与缓存测试
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudDeliverable.swift scripts/CloudDeliverableTests.swift -o /tmp/cloud-deliverable-tests
          /tmp/cloud-deliverable-tests
      - name: 回头提醒解析单测
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudFollowUp.swift scripts/CloudFollowUpTests.swift -o /tmp/cloud_followup_tests
          /tmp/cloud_followup_tests
      - name: 一句话版本拆分单测
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudOneLine.swift scripts/CloudOneLineTests.swift -o /tmp/cloud_oneline_tests
          /tmp/cloud_oneline_tests
      - name: 离线发件箱单测
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudOutbox.swift scripts/CloudOutboxTests.swift -o /tmp/cloud_outbox_tests
          /tmp/cloud_outbox_tests
      - name: 一句话交班与任务时间轴单测
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudShiftSpeech.swift scripts/CloudShiftSpeechTests.swift -o /tmp/cloud-shift-speech-tests
          /tmp/cloud-shift-speech-tests
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudTaskTimeline.swift scripts/CloudTaskTimelineTests.swift -o /tmp/cloud-task-timeline-tests
          /tmp/cloud-task-timeline-tests
      - name: 刚才那个、单手模式与值班模式单测
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudAttachmentLines.swift src/ios/Views/Chat/AIChatView/Cloud/CloudLastRef.swift scripts/CloudLastRefTests.swift -o /tmp/cloud-last-ref-tests
          /tmp/cloud-last-ref-tests
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudOneHandMode.swift scripts/CloudOneHandModeTests.swift -o /tmp/cloud-onehand-tests
          /tmp/cloud-onehand-tests
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudDutyMode.swift scripts/CloudDutyModeTests.swift -o /tmp/cloud-duty-mode-tests
          /tmp/cloud-duty-mode-tests
      - name: 口述结构化、云电脑断点与 IPA 清单单测
        run: |
          set -o pipefail
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudOralStruct.swift scripts/CloudOralStructTests.swift -o /tmp/cloud-oral-struct-tests
          /tmp/cloud-oral-struct-tests
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudDesktopCheckpoint.swift scripts/CloudDesktopCheckpointTests.swift -o /tmp/cloud-desktop-checkpoint-tests
          /tmp/cloud-desktop-checkpoint-tests
          swiftc -swift-version 5 -parse-as-library src/ios/Views/Chat/AIChatView/Cloud/CloudIPAChecklist.swift scripts/CloudIPAChecklistTests.swift -o /tmp/cloud-ipa-checklist-tests
