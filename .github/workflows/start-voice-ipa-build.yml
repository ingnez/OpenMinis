name: Start the realtime voice IPA build

on:
  push:
    branches:
      - grokbot-phase2-voice-playback-build
    paths:
      - '.github/workflows/start-voice-ipa-build.yml'

permissions: {}

jobs:
  dispatch:
    if: github.repository == 'ingnez/OpenMinis' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Start the existing iOS IPA workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/build-ios.yml/dispatches" \
            --raw-field ref=grokbot-phase2-voice-playback
