# One-time request from the authenticated owner of ingnez/OpenMinis to keep only 7462d1c.
name: Stop superseded OpenMinis voice build
on:
  push:
    branches:
      - grokbot-phase2-voice-playback-build
    paths:
      - .github/workflows/cancel-superseded-voice-build.yml
permissions:
  actions: write
jobs:
  cancel-superseded:
    if: github.repository == 'ingnez/OpenMinis'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Release the Mac if the old voice build is still running
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          old="repos/ingnez/OpenMinis/actions/runs/43222484128"
          current="repos/ingnez/OpenMinis/actions/runs/43224575415"
          old_json="$(gh api "$old")"
          current_json="$(gh api "$current")"
          test "$(jq -r .head_sha <<< "$old_json")" = "4a51b81267d043d791cd3398e8ff060bb49ca47f"
          test "$(jq -r .head_sha <<< "$current_json")" = "7462d1cfafcda2c37e83b6855917077b1a295c5d"
          if [[ "$(jq -r .status <<< "$old_json")" == completed || "$(jq -r .status <<< "$current_json")" == completed ]]; then
            exit 0
          fi
          gh api --method POST "$old/cancel"
