# One-time request from the owner of ingnez/OpenMinis to stop run 43210626022 if its IPA build is still active.
name: Stop superseded OpenMinis IPA build
on:
  push:
    branches:
      - grokbot-phase2-voice-playback-build
    paths:
      - .github/workflows/cancel-superseded-ipa-build.yml
permissions:
  actions: write
jobs:
  cancel-old-build:
    if: github.repository == 'ingnez/OpenMinis'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only the still-running superseded build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          old_run="repos/ingnez/OpenMinis/actions/runs/43210626022"
          new_run="repos/ingnez/OpenMinis/actions/runs/43216210218"
          old="$(gh api "$old_run")"
          new="$(gh api "$new_run")"
          test "$(jq -r .head_sha <<< "$old")" = "9b90b3d78e321a5e54aba224ac3ae4a4b505ba1c"
          test "$(jq -r .head_sha <<< "$new")" = "caf40f4311fb3c27c8135e7dae239c812489186f"
          if [[ "$(jq -r .status <<< "$old")" == completed || "$(jq -r .status <<< "$new")" == completed ]]; then
            echo "No cancellation needed."
            exit 0
          fi
          job_status="$(gh api "$old_run/jobs" --jq '.jobs[] | select(.name=="build") | .status')"
          if [[ "$job_status" == completed ]]; then
            echo "The old build job has already finished."
            exit 0
          fi
          gh api --method POST "$old_run/cancel"
