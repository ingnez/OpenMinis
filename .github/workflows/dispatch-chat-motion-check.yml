name: Stop superseded OpenMinis IPA dispatch
on:
  push:
    branches: [grokbot-phase2-chat-motion-ci]
    paths: [.github/workflows/dispatch-chat-motion-check.yml]
permissions:
  actions: write
jobs:
  cancel:
    if: github.repository == 'ingnez/OpenMinis'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop the dispatch for the superseded revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_path="repos/$GITHUB_REPOSITORY/actions/runs/43318344788"
          test "$(gh api "$run_path" --jq .head_sha)" = d636c642f9415ee9b7a19102650e4f157ee72845
          if [ "$(gh api "$run_path" --jq .status)" != completed ]; then
            gh api --method POST "$run_path/cancel"
          fi
