name: Dispatch corrected OpenMinis IPA
on:
  push:
    branches: [grokbot-phase2-chat-motion-ci]
    paths: [.github/workflows/dispatch-chat-motion-check.yml]
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    if: github.repository == 'ingnez/OpenMinis'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the corrected iOS build
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: grokbot-phase2-chat-motion
          EXPECTED_SHA: 958cf5da17d5c446f3c332a7009f23e0ceb77d80
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_BRANCH" --jq '.object.sha')" = "$EXPECTED_SHA"
          gh workflow run build-ios.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH" -f mac_runner=macos-15-intel
