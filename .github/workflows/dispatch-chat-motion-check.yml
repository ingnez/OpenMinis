name: Apply background task fixes and build IPA
on:
  push:
    branches: [grokbot-phase2-chat-motion-ci]
    paths: [.github/workflows/dispatch-chat-motion-check.yml]
permissions:
  actions: write
  contents: write
jobs:
  dispatch:
    if: github.repository == 'ingnez/OpenMinis'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5715bcca9756c15a47a09f001277e44a31466079
      - name: Apply verified changes and request IPA
        env:
          GH_TOKEN: ${{ github.token }}
          MOTION_BRANCH: grokbot-phase2-chat-motion
          EXPECTED_PARENT: 5715bcca9756c15a47a09f001277e44a31466079
          EXPECTED_TREE: 2a7e65885bcde26584a1cc7bd5de73580f0d8fe8
          PATCH_B64: ''
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$MOTION_BRANCH" --jq '.object.sha')" = "$EXPECTED_PARENT"
          motion_patch=$(mktemp)
          printf '%s' "$PATCH_B64" | base64 --decode | gzip -dc > "$motion_patch"
          git apply --index --whitespace=error "$motion_patch"
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git -c user.name='OpenMinis CI' -c user.email='actions@users.noreply.github.com' commit -m 'Let background work finish and separate task results from chat'
          git push origin HEAD:refs/heads/"$MOTION_BRANCH"
          gh workflow run build-ios.yml --repo "$GITHUB_REPOSITORY" --ref "$MOTION_BRANCH" -f mac_runner=macos-15
