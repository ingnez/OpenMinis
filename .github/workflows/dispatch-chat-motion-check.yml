name: Dispatch OpenMinis motion checks
on:
  push:
    branches: [grokbot-phase2-chat-motion-ci]
    paths: [.github/workflows/dispatch-chat-motion-check.yml]
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    if: github.repository == 'ingnez/OpenMinis'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run focused iOS checks
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: 9bfc9a430efc13bd87eccce59aa8e752dae8b2f7
          MOTION_BRANCH: grokbot-phase2-chat-motion
          ONLY_TESTING: 'MinisUITests/ImageExperienceUITests/testI1_scrubOpensNthImage,MinisUITests/E2EFlowsUITests/test10_stackCaptionFanOutAndViewer,MinisUITests/E2EFlowsUITests/test21_realtimeCallBothDirections,MinisUITests/ReplyModeUITests/testReply_burstInterject'
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$MOTION_BRANCH" --jq '.object.sha')" = "$EXPECTED_COMMIT"
          gh workflow run build-ios.yml --repo "$GITHUB_REPOSITORY" --ref "$MOTION_BRANCH" -f ui_tests=true -f mac_runner=macos-26 -f only_testing="$ONLY_TESTING"
