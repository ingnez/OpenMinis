name: Validate OpenMinis motion and reply recovery
on:
  push:
    branches: [grokbot-phase2-chat-motion-ci]
    paths: [.github/workflows/dispatch-chat-motion-check.yml]
permissions:
  actions: write
  contents: write
jobs:
  dispatch:
    if: github.repository == 'ingnez/OpenMinis'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9bfc9a430efc13bd87eccce59aa8e752dae8b2f7
      - name: Apply and verify the tested source changes
        env:
          GH_TOKEN: ${{ github.token }}
          MOTION_BRANCH: grokbot-phase2-chat-motion
          EXPECTED_PARENT: 9bfc9a430efc13bd87eccce59aa8e752dae8b2f7
          EXPECTED_TREE: eec52b5f78bab3acddadcf44602cd29e2de3fe34
          ONLY_TESTING: 'MinisUITests/ImageExperienceUITests/testI1_scrubOpensNthImage,MinisUITests/E2EFlowsUITests/test10_stackCaptionFanOutAndViewer,MinisUITests/E2EFlowsUITests/test21_realtimeCallBothDirections,MinisUITests/ReplyModeUITests/testReply_burstInterject'
          PATCH_B64: ''
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$MOTION_BRANCH" --jq '.object.sha')" = "$EXPECTED_PARENT"
          motion_patch=$(mktemp)
          printf '%s' "$PATCH_B64" | base64 --decode > "$motion_patch"
          git apply --index --whitespace=error "$motion_patch"
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git -c user.name='OpenMinis CI' -c user.email='actions@users.noreply.github.com' commit -m 'Recover queued replies after model errors and fix image picker compilation'
          git push origin HEAD:refs/heads/"$MOTION_BRANCH"
          gh workflow run build-ios.yml --repo "$GITHUB_REPOSITORY" --ref "$MOTION_BRANCH" -f ui_tests=true -f mac_runner=macos-15 -f only_testing="$ONLY_TESTING"
