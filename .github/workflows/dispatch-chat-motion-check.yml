name: Build the latest iOS package with original Bot avatars
on:
  push:
    branches: [grokbot-phase2-chat-motion-ci]
    paths: [.github/workflows/dispatch-chat-motion-check.yml]
permissions:
  actions: write
  contents: write
jobs:
  dispatch:
    if: github.repository == 'ingnez/OpenMinis'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6f5e7b9c6fa2195fdb2acdf497dc0da1937e288c
      - name: Apply the verified avatar update and build
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: grokbot-phase2-chat-motion
          EXPECTED_PARENT: 6f5e7b9c6fa2195fdb2acdf497dc0da1937e288c
          EXPECTED_TREE: b91fbdb1e62ff4ba382e5f00b3e0d26e2ed64e53
          PATCH_B64: ''
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_BRANCH" --jq '.object.sha')" = "$EXPECTED_PARENT"
          avatar_patch=$(mktemp)
          printf '%s' "$PATCH_B64" | base64 --decode | gzip -dc > "$avatar_patch"
          git apply --index --whitespace=error "$avatar_patch"
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git -c user.name='OpenMinis CI' -c user.email='actions@users.noreply.github.com' commit -m 'Use original Grok Bot avatar artwork and palette'
          git push origin HEAD:refs/heads/"$TARGET_BRANCH"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_BRANCH" --jq '.object.sha')" = "$(git rev-parse HEAD)"
          gh workflow run build-ios.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH" -f mac_runner=macos-15-intel
          old_run=43251208973
          old_info=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$old_run")
          if jq -e --arg parent "$EXPECTED_PARENT" '.head_sha == $parent and .head_branch == "grokbot-phase2-chat-motion" and .status != "completed"' <<< "$old_info" >/dev/null; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$old_run/force-cancel"
          fi
