name: Build app-wide iPhone typography
on:
  push:
    branches: [grokbot-phase2-chat-motion-ci]
    paths: [.github/workflows/dispatch-chat-motion-check.yml]
permissions:
  actions: write
  contents: write
jobs:
  dispatch:
    if: github.repository == 'ingnez/OpenMinis'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1b667f71c69064f23ebd79227467389e12a180f8
      - name: Apply verified source and dispatch IPA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: grokbot-phase2-chat-motion
          EXPECTED_PARENT: 1b667f71c69064f23ebd79227467389e12a180f8
          EXPECTED_TREE: 5dafa3f1c0921af05d7a974a42b442c4ae3619e6
          SUPERSEDED_RUN: "43248754006"
          PATCH_B64: ''
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_BRANCH" --jq '.object.sha')" = "$EXPECTED_PARENT"
          source_patch=$(mktemp)
          printf '%s' "$PATCH_B64" | base64 --decode | gzip -dc > "$source_patch"
          git apply --index --whitespace=error "$source_patch"
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git -c user.name='OpenMinis CI' -c user.email='actions@users.noreply.github.com' commit -m 'Follow iPhone typography across app interfaces'
          git push origin HEAD:refs/heads/"$TARGET_BRANCH"
          gh workflow run build-ios.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH" -f mac_runner=macos-15-intel
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SUPERSEDED_RUN" --jq '.head_sha')" = "$EXPECTED_PARENT" ] &&
             gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SUPERSEDED_RUN/jobs" | jq -e 'any(.jobs[]; .name == "wait-mac" and .status == "in_progress") and all(.jobs[]; .name != "build")' >/dev/null; then
            gh run cancel "$SUPERSEDED_RUN" --repo "$GITHUB_REPOSITORY" || true
          fi
