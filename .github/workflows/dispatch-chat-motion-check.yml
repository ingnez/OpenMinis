name: Dispatch OpenMinis message menu tests
on:
  push:
    branches: [grokbot-phase2-chat-motion-ci]
    paths: [.github/workflows/dispatch-chat-motion-check.yml]
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    if: github.repository == 'ingnez/OpenMinis'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the message menu simulator tests
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: grokbot-phase2-message-menu
          EXPECTED_SHA: a08eba3b24ff4e7ef90a2cd0e90973522e07b6bd
          TESTS: MinisUITests/E2EFlowsUITests/test32_longPressMenuSheet,MinisUITests/E2EFlowsUITests/test34_longPressOwnCloudMessage,MinisUITests/E2EFlowsUITests/test35_longPressLocalMessages
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_BRANCH" --jq '.object.sha')" = "$EXPECTED_SHA"
          gh workflow run build-ios.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH" -f ui_tests=true -f mac_runner=macos-26 -f only_testing="$TESTS"
