name: Build Bot conversation and iPhone typography fixes
on:
  push:
    branches: [grokbot-phase2-chat-motion-ci]
    paths: [.github/workflows/dispatch-chat-motion-check.yml]
permissions:
  actions: write
  contents: write
jobs:
  dispatch:
    if: github.repository == 'ingnez/OpenMinis'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b5ac104e0a2133866596dfc292b710ec3f6a0a45
      - name: Apply source and dispatch IPA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: grokbot-phase2-chat-motion
          EXPECTED_PARENT: b5ac104e0a2133866596dfc292b710ec3f6a0a45
          EXPECTED_TREE: 93e74f64a3d9bf0f782877acd6083d5f9a53d156
          PATCH_B64: ''
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_BRANCH" --jq '.object.sha')" = "$EXPECTED_PARENT"
          source_patch=$(mktemp)
          printf '%s' "$PATCH_B64" | base64 --decode | gzip -dc > "$source_patch"
          git apply --index --whitespace=error "$source_patch"
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git -c user.name='OpenMinis CI' -c user.email='actions@users.noreply.github.com' commit -m 'Match Bot home, manage conversation history, and follow iPhone typography'
          git push origin HEAD:refs/heads/"$TARGET_BRANCH"
          gh workflow run build-ios.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH" -f mac_runner=macos-15-intel
