name: Apply Bot conversation and home fixes
on:
  push:
    branches: [grokbot-phase2-chat-motion-ci]
    paths: [.github/workflows/dispatch-chat-motion-check.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'ingnez/OpenMinis'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b5ac104e0a2133866596dfc292b710ec3f6a0a45
      - name: Apply and verify the tested source changes
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: grokbot-phase2-chat-motion
          EXPECTED_PARENT: b5ac104e0a2133866596dfc292b710ec3f6a0a45
          EXPECTED_TREE: 11ce06e456755890b5879cbf0c13666811e1824d
          PATCH_B64: ''
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_BRANCH" --jq '.object.sha')" = "$EXPECTED_PARENT"
          source_patch=$(mktemp)
          printf '%s' "$PATCH_B64" | base64 --decode | gzip -dc > "$source_patch"
          git apply --index --whitespace=error "$source_patch"
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git -c user.name='OpenMinis CI' -c user.email='actions@users.noreply.github.com' commit -m 'Match Bot home search and manage conversations with system typography'
          git push origin HEAD:refs/heads/"$TARGET_BRANCH"
