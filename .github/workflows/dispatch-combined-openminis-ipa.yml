name: Validate the combined OpenMinis candidate and publish one IPA
on:
  push:
    branches: [grokbot-phase2-chat-motion-ci]
    paths: [.github/workflows/dispatch-combined-openminis-ipa.yml]
permissions:
  actions: write
  contents: read
env:
  TARGET_BRANCH: grokbot-phase2-combined-20261113
  EXPECTED_SHA: a5a2b7c9230026e5df6f9d6a77eafba306f99977
jobs:
  dispatch:
    if: github.repository == 'ingnez/OpenMinis'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    outputs:
      build_run: ${{ steps.dispatch.outputs.build_run }}
      test_run: ${{ steps.dispatch.outputs.test_run }}
      backend_recheck: ${{ steps.dispatch.outputs.backend_recheck }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          path: candidate
      - name: Verify the existing combined regression, then dispatch the IPA
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="repos/$GITHUB_REPOSITORY"
          ref="$repo/git/ref/heads/$TARGET_BRANCH"
          if [ "$(gh api "$ref" --jq '.object.sha')" != "$EXPECTED_SHA" ]; then
            echo "A newer revision superseded $EXPECTED_SHA"
            exit 0
          fi
          runs="$repo/actions/workflows/build-ios.yml/runs?branch=$TARGET_BRANCH&head_sha=$EXPECTED_SHA&event=workflow_dispatch&per_page=10"
          last_id=43427487762
          completed_checks=0
          while true; do
            result=$(gh api "$runs" --jq '(.workflow_runs[0] // {}) | [(.id // 0), (.status // "pending"), (.conclusion // "pending")] | @tsv')
            IFS=$'\t' read -r test_id status conclusion <<< "$result"
            if [ "$test_id" != "$last_id" ]; then
              echo "Combined simulator run: $test_id"
              completed_checks=0
              last_id="$test_id"
            fi
            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then break; fi
              # Keep successful same-SHA simulator work. A single group timeout
              # can be rechecked by the IPA workflow, which runs the complete
              # Linux suite and installed-browser checks again before release.
              jobs_url="$repo/actions/runs/$test_id/jobs?filter=all&per_page=100"
              cloud_only=$(gh api "$jobs_url" --jq '.jobs | group_by(.name) | map(max_by(.id)) | (map(select(.conclusion != "success" and .conclusion != "skipped")) | map(.name) | sort) as $bad | ($bad == ["cloud-computer-linux"] and any(.[]; .name == "cloud-computer-linux" and .conclusion == "failure") and any(.[]; .name == "ui-tests" and .conclusion == "success") and any(.[]; .name == "quick-linux" and .conclusion == "success"))')
              if [ "$conclusion" = failure ] && [ "$cloud_only" = true ]; then
                cloud_job=$(gh api "$jobs_url" --jq '[.jobs[] | select(.name == "cloud-computer-linux")] | max_by(.id) | .id')
                cloud_log=$(mktemp)
                gh run view "$test_id" --repo "$GITHUB_REPOSITORY" --job "$cloud_job" --log-failed > "$cloud_log"
                if grep -Fq 'FAIL: test_group_api_and_flow (test_phase7_groups.GroupServerTests.test_group_api_and_flow)' "$cloud_log" \
                  && grep -Eq 'FAILED \(failures=1, skipped=[0-9]+\)' "$cloud_log" \
                  && ! grep -Eq '(^|[[:space:]])ERROR: ' "$cloud_log"; then
                  echo "One group-result timeout; complete Linux validation must pass in the same-SHA IPA workflow"
                  echo "backend_recheck=group-result-timeout" >> "$GITHUB_OUTPUT"
                  break
                fi
              fi
              completed_checks=$((completed_checks + 1))
              if [ "$completed_checks" -ge 4 ]; then echo "Combined simulator tests: $conclusion"; exit 1; fi
            fi
            sleep 45
          done
          echo "test_run=$test_id" >> "$GITHUB_OUTPUT"
          evidence=$(mktemp -d)
          gh run download "$test_id" --repo "$GITHUB_REPOSITORY" --name Minis-e2e-early --dir "$evidence"
          gh run download "$test_id" --repo "$GITHUB_REPOSITORY" --name Minis-ui-tests --dir "$evidence/full"
          gh api "$repo/actions/runs/$test_id/jobs?filter=all&per_page=100" --jq '[.jobs[] | select(.name == "ui-tests")] | max_by(.id) | .steps[] | select(.name | contains("iOS 单元测试 MinisTests")) | .conclusion' | grep -Fx success
          python3 - "$evidence/e2e-summary.md" "$evidence/full/unit-tests.log" "$GITHUB_WORKSPACE/candidate" <<'PY'
          import re
          import sys
          from pathlib import Path

          source = Path(sys.argv[3])
          workflow = (source / ".github/workflows/build-ios.yml").read_text()
          selections = re.search(r'DEFAULT_ONLY_TESTING="([^"]+)"', workflow).group(1).split()
          expected = set()
          for selection in selections:
              target, suite = selection.split('/')
              swift = (source / f"src/ios/{target}/{suite}.swift").read_text()
              methods = re.findall(r"\bfunc\s+(test\w+)\s*\(", swift)
              if not methods:
                  sys.exit(f"No tests found for {suite}")
              expected.update(f"{suite}.{method}" for method in methods)
          results = {}
          for line in Path(sys.argv[1]).read_text().splitlines():
              if line.startswith('|'):
                  fields = line.split('|')
                  if len(fields) >= 4:
                      results[fields[1].strip()] = fields[2].strip()
          missing = sorted(case for case in expected if not results.get(case, '').startswith('PASS'))
          if not expected or missing:
              sys.exit("Missing, skipped or failed XCTest cases: " + ', '.join(missing))
          unit = Path(sys.argv[2]).read_text()
          counts = re.findall(r"Executed (\d+) tests?, with (\d+) failures?", unit)
          if not counts or not any(int(tests) > 0 for tests, _ in counts):
              sys.exit("MinisTests did not execute any tests")
          if any(int(failed) != 0 for _, failed in counts) or '** TEST SUCCEEDED **' not in unit:
              sys.exit("MinisTests did not complete successfully")
          print(f"{len(expected)}/{len(expected)} combined UI cases passed, with successful MinisTests results")
          PY
          if [ "$(gh api "$ref" --jq '.object.sha')" != "$EXPECTED_SHA" ]; then
            echo "A newer revision superseded $EXPECTED_SHA"
            exit 0
          fi
          before=$(gh api "$runs" --jq '.workflow_runs[0].id // 0')
          gh workflow run build-ios.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH" -f mac_runner=macos-15-intel
          while true; do
            result=$(gh api "$runs" --jq "([.workflow_runs[] | select(.id > $before)][0] // {}) | [(.id // 0), (.status // \"pending\"), (.conclusion // \"pending\")] | @tsv")
            IFS=$'\t' read -r build_id status conclusion <<< "$result"
            if [ "$status" = completed ]; then
              echo "IPA build $build_id: $conclusion"
              if [ "$conclusion" = success ]; then
                echo "build_run=$build_id" >> "$GITHUB_OUTPUT"
                break
              fi
              if [ "$build_id" != "${last_id:-}" ]; then
                completed_checks=0
                last_id=$build_id
              fi
              completed_checks=$((completed_checks + 1))
              if [ "$completed_checks" -ge 3 ]; then exit 1; fi
            fi
            sleep 45
          done

  prerelease:
    needs: dispatch
    if: needs.dispatch.outputs.build_run != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          path: candidate
      - name: Verify and publish the same-commit unsigned IPA
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ needs.dispatch.outputs.build_run }}
          TEST_RUN: ${{ needs.dispatch.outputs.test_run }}
          BACKEND_RECHECK: ${{ needs.dispatch.outputs.backend_recheck }}
        run: |
          set -euo pipefail
          ref="repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_BRANCH"
          test "$(gh api "$ref" --jq '.object.sha')" = "$EXPECTED_SHA"
          test "$(gh run view "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = "$EXPECTED_SHA"
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name Minis-unsigned-ipa
          test "$(cat SOURCE_COMMIT.txt)" = "$EXPECTED_SHA"
          sha256sum --check SHA256SUMS
          unzip -tq Minis-unsigned.ipa
          python3 candidate/scripts/check_ipa_promotion.py Minis-unsigned.ipa
          python3 - <<'PY'
          import hashlib
          import io
          from pathlib import Path
          import re
          import tarfile
          import zipfile

          expected = {}
          for path in Path('candidate/cloud-agent').iterdir():
              if path.is_file() and not path.name.startswith('test') and path.suffix in ('.py', '.sh', '.md', '.service'):
                  expected[path.name] = hashlib.sha256(path.read_bytes()).digest()
          with zipfile.ZipFile('Minis-unsigned.ipa') as ipa:
              bundles = [name for name in ipa.namelist() if re.fullmatch(r'Payload/[^/]+\.app/cloud-agent-bundle\.tar\.gz', name)]
              assert len(bundles) == 1, 'Expected one bundled Agent archive'
              with tarfile.open(fileobj=io.BytesIO(ipa.read(bundles[0])), mode='r:gz') as agent:
                  assert {item.name for item in agent.getmembers() if item.isfile()} == set(expected)
                  for name, digest in expected.items():
                      assert hashlib.sha256(agent.extractfile(name).read()).digest() == digest, name
          print(f'Verified {len(expected)} bundled Agent files against the tested source')
          PY
          short_sha=${EXPECTED_SHA:0:7}
          tag="grokbot-combined-$short_sha"
          ipa="Minis-combined-$short_sha-unsigned.ipa"
          mv Minis-unsigned.ipa "$ipa"
          sha256sum "$ipa" > "$ipa.sha256"
          notes="The full simulator and MinisTests regressions passed. IPA source: $EXPECTED_SHA. Simulator: https://github.com/$GITHUB_REPOSITORY/actions/runs/$TEST_RUN. Linux checks and IPA build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN"
          if [ -n "$BACKEND_RECHECK" ]; then
            notes="$notes. The simulator workflow had one Linux group-result timeout; all Linux checks were rerun successfully in the IPA workflow."
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" "$ipa" "$ipa.sha256" --repo "$GITHUB_REPOSITORY" \
              --target "$EXPECTED_SHA" --prerelease --title "OpenMinis $short_sha (unsigned)" \
              --notes "$notes"
          fi
          curl --fail --silent --show-error --location --head --retry 4 --max-time 30 \
            --output /dev/null "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$ipa"
          sha256sum "$ipa"
