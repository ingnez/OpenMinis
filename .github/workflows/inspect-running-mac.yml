name: Inspect the current Mac log without interrupting it
on:
  push:
    branches: [grokbot-phase2-chat-motion-ci]
    paths:
      - .github/workflows/inspect-running-mac.yml
      - scripts/diagnostics/inspect_mac_progress.py
  workflow_dispatch:
    inputs:
      job_id:
        type: string
        default: '132171378942'
      expected_sha:
        type: string
        default: '413e929f02e89fe983fe81362f1badf0ad3c254f'
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read current Mac metadata and log tail
        env:
          GH_TOKEN: ${{ github.token }}
          INSPECT_JOB_ID: ${{ inputs.job_id }}
          INSPECT_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python3 scripts/diagnostics/inspect_mac_progress.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-mac-progress
          path: |
            mac-job.json
            mac-live.log
            mac-progress.json
            mac-live-tail.log
            mac-operation-tail.log
            mac-test-results.log
            mac-failure-context.log
            mac-entry-failure.log
          retention-days: 7
