name: Check VPS Cloud Agent
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 真实云端模块类型检查
        run: |
          set -o pipefail
          xcrun swiftc -swift-version 5 -typecheck -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios16.0 scripts/CloudConnectionTypecheckSupport.swift scripts/CloudViewsTypecheckSupport.swift scripts/CloudChatTypecheckSupport.swift scripts/CloudPhase1TypecheckSupport.swift src/ios/Views/Chat/AIChatView/Cloud/*.swift 2>&1 | tee cloud-ui-typecheck.log
      - name: 云端服务集成验证
        run: python3 -m unittest discover -s cloud-agent -p 'test*.py' -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-check-log
          path: cloud-ui-typecheck.log
