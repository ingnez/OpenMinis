name: Publish and build the instant reply update

on:
  push:
    branches:
      - grokbot-phase2-voice-playback-build
    paths:
      - '.github/workflows/dispatch-instant-reply-build.yml'

permissions: {}

jobs:
  publish-and-dispatch:
    if: github.repository == 'ingnez/OpenMinis' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish the verified commit and start the IPA build
