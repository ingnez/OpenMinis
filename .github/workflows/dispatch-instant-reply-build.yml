          OPENMINIS_BUNDLE
          target='grokbot-phase2-instant-reply'
          git bundle verify "$bundle"
          git fetch --no-tags "$bundle" "refs/heads/$target"
          source_commit=$(git rev-parse FETCH_HEAD)
          test "$source_commit" = '9b90b3d78e321a5e54aba224ac3ae4a4b505ba1c'
          test "$(git rev-parse "$source_commit^{tree}")" = 'a7c48dc4e837bedb0c4d4df1dd95806670a85c7e'
          existing=$(git ls-remote --heads origin "refs/heads/$target" | cut -f1)
          if [[ -z "$existing" ]]; then
            git push origin "$source_commit:refs/heads/$target"
          else
            test "$existing" = "$source_commit"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/build-ios.yml/dispatches" --raw-field ref="$target"
